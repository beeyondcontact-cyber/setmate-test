<style>
:root{--bg:#08080a;--win:#0f0f12;--side:#0b0b0e;--panel:#151519;--panel2:#1b1b21;--panel3:#22222a;--line:#26262e;--line2:#30303a;
  --txt:#ececf1;--txt2:#b4b4c0;--muted:#9a9aa8;--blue:#2fa4ff;--orange:#ff8a1f;--green:#3ddc84;--red:#ff4d5e;--violet:#a77bff;--r:12px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1d2a 0%,var(--bg) 60%);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;height:100dvh}
nav{background:var(--side);border-right:1px solid var(--line);padding:16px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:2px 10px 18px}
.logo em{font-style:normal;color:var(--blue)}
.disc{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--blue),var(--violet),var(--orange),var(--blue));display:grid;place-items:center;animation:spin 8s linear infinite;flex:none}
.disc::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--side)}
@keyframes spin{to{transform:rotate(360deg)}}
.nb{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;position:relative;transition:background .15s,color .15s}
.nb:hover{background:var(--panel);color:var(--txt)}
.nb.on{background:var(--panel2);color:var(--txt)}
.nb.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue)}
.nb svg{width:18px;height:18px;flex:none}
.bdg{margin-left:auto;background:var(--orange);color:#111;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.bdg.blue{background:var(--blue);color:#fff}
.dotr{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,77,94,.2)}
.navsp{flex:1}
.navfoot{font-size:11px;color:var(--muted);padding:10px 11px 2px;border-top:1px solid var(--line);margin-top:6px;line-height:1.6}
.navfoot i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(15,15,18,.9)}
.search{all:unset;cursor:pointer;flex:1;max-width:460px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}
.kbd{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.tsp{flex:1}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--green)}.pill.warn i{background:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);position:relative}
.ib[disabled]{opacity:.35;cursor:default}
.ib svg{width:17px;height:17px}
.ib .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.banner{display:flex;align-items:center;gap:12px;padding:9px 18px;background:rgba(255,138,31,.09);border-bottom:1px solid #4a3420;font-size:13px;color:#ffd2a8}
.banner.blue{background:rgba(47,164,255,.08);border-color:#23466a;color:#cfe6ff}
main{flex:1;overflow:auto;padding:22px 24px 30px}
main>.screen{max-width:1280px;margin-inline:auto}
.noscr{max-width:520px;margin:40px auto;padding:0 20px;text-align:center;font-size:16px;line-height:1.5}
.screen{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font-size:24px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:2px 0 18px;font-size:13px}
h3{font-size:14px;margin-bottom:2px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.hi{background:linear-gradient(135deg,rgba(47,164,255,.12),rgba(167,123,255,.06) 60%,var(--panel));border-color:#28415e}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-lib{grid-template-columns:1fr 320px}.g-next{grid-template-columns:1fr 300px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}.mt{margin-top:14px}.mt2{margin-top:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.orange{background:var(--orange);color:#140b00}.btn.green{background:var(--green);color:#04210f}.btn.red{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{all:unset;cursor:pointer;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.chip.on{border-color:var(--blue);color:var(--txt);background:rgba(47,164,255,.13)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--txt)}
input.f,select.f,textarea.f{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 11px;font:inherit;font-size:13px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue)}
textarea.f{width:100%;min-height:110px;resize:vertical;line-height:1.55}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--txt)}
.tbl td{padding:7px 8px;border-bottom:1px solid #1d1d24;vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:#1a1a20}.tbl tr.sel td{background:rgba(47,164,255,.09)}
.tw{max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);overflow:auto;border-radius:var(--r)}
.tt{display:flex;align-items:center;gap:10px;min-width:0}
.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.tt small{color:var(--muted)}
.cv{width:36px;height:36px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;color:rgba(0,0,0,.65);background-size:cover;background-position:center}
.cv.lg{width:64px;height:64px;font-size:20px;border-radius:10px}.cv.xl{width:84px;height:84px;font-size:26px;border-radius:12px}
.key{display:inline-block;min-width:36px;text-align:center;padding:2px 6px;border-radius:5px;font-weight:800;font-size:12px;color:#0b0b0d}
.key.est{outline:1px dashed rgba(255,255,255,.55);outline-offset:1px}
.key.none{background:#2a2a33!important;color:var(--muted)}
.nrg{display:inline-block;width:56px;height:6px;border-radius:3px;background:#262630;vertical-align:middle;overflow:hidden}
.nrg i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--orange))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px;background:#24242c;color:#c9c9d3;white-space:nowrap}
.tag.ok{background:rgba(61,220,132,.13);color:var(--green)}.tag.warn{background:rgba(255,138,31,.14);color:var(--orange)}
.tag.bad{background:rgba(255,77,94,.14);color:var(--red)}.tag.info{background:rgba(47,164,255,.14);color:var(--blue)}.tag.learn{background:rgba(167,123,255,.15);color:var(--violet)}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.play{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;flex:none;background:var(--panel3);border:1px solid var(--line2);display:grid;place-items:center}
.play:hover{background:var(--blue);border-color:var(--blue)}.play.on{background:var(--orange);border-color:var(--orange)}
.play svg{width:12px;height:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:28px}
.big{font-size:22px;font-weight:800;letter-spacing:-.3px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #22222a;cursor:pointer}
.ck:last-child{border:0}
.ck .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.ck.done .bx{background:var(--green);border-color:var(--green)}
.ck.done span.l{color:var(--muted);text-decoration:line-through}
.ck .go{margin-left:auto;color:var(--muted);font-size:12px}
.mini{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #22222a;min-width:0}
.mini:last-child{border:0}
.stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #22222a;cursor:pointer}
.stat:last-child{border:0}.stat b{font-size:16px}
.bars .br{display:grid;grid-template-columns:100px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:12px;color:var(--txt2)}
.bars .tr{height:10px;background:#1f1f27;border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.hist .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hist .c i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.hist .c span{font-size:10px;color:var(--muted)}
.now{display:flex;align-items:center;gap:16px}
.sg{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);margin-top:8px}
.sc{width:48px;flex:none;text-align:center}.sc b{font-size:18px;font-weight:800}
.sc .bar{height:4px;border-radius:2px;background:#2a2a33;margin-top:3px;overflow:hidden}.sc .bar i{display:block;height:100%}
.why{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.setrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);margin-top:6px}
.setrow .n{width:20px;color:var(--blue);font-weight:800;text-align:center}
.trn{display:flex;justify-content:center;margin:-2px 0 -2px 30px}
.mi{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.mi:hover{background:var(--panel3);color:var(--txt)}
.wheel text{font-size:9px;font-weight:700;pointer-events:none}.wheel path{cursor:pointer}
.drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;max-height:300px;overflow:auto;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.drop div{padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:10px}.drop div:hover,.drop div.on{background:var(--panel3)}
.trend{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #20202a}
.rank{font-weight:800;font-size:18px;color:var(--txt2);text-align:center;line-height:1}.rank small{display:block;font-size:10px;margin-top:3px}
.place{font-size:11px;color:var(--muted);margin-top:3px}.place b{color:var(--txt2);font-weight:600}
.src{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--muted);margin-right:3px}
.mic{all:unset;cursor:pointer;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;margin:14px auto 8px;background:radial-gradient(circle at 35% 30%,#ff7180,#c5172d);box-shadow:0 0 0 10px rgba(255,77,94,.10),0 0 0 22px rgba(255,77,94,.05),0 18px 40px rgba(200,20,40,.35)}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,77,94,.22),0 0 0 36px rgba(255,77,94,.08)}}
.mic svg{width:48px;height:48px}
.guide{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.guide span{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--txt2)}
.pt{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #22222a}
.pt input{accent-color:var(--green);width:17px;height:17px;margin-top:2px;flex:none}
.pt q{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:8px}
.player{display:flex;align-items:center;gap:12px;padding:9px 18px;border-top:1px solid var(--line);background:linear-gradient(#111116,#0d0d11)}
.player .info{min-width:0;flex:0 1 280px}
.player .info b,.player .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .info small{color:var(--muted);font-size:11px}
.pbar{flex:1;height:5px;background:#24242c;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange))}
.ov{position:fixed;inset:0;background:rgba(5,5,8,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(560px,100%);box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .25s var(--ease);max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{font-size:19px;margin-bottom:4px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--muted)}
.step.done{color:var(--txt)}.step.err{color:var(--red)}
.step .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none}
.step.done .st{background:var(--green);border-color:var(--green);color:#04210f}
.step.err .st{background:var(--red);border-color:var(--red);color:#fff}
.step.run .st{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.prog{height:8px;background:#22222a;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .2s}
.pal{width:min(600px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;align-self:start;margin-top:12vh}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--txt);font-size:16px;outline:none}
.pal .res{max-height:360px;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer}
.pal .it.on{background:var(--panel3)}.pal .it small{margin-left:auto;color:var(--muted);font-size:11px}
.notif{position:fixed;top:56px;right:18px;width:340px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);z-index:40;padding:6px;max-height:60vh;overflow:auto}
.notif .it{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer}.notif .it:focus-visible{outline:2px solid var(--blue)}.notif .it:hover{background:var(--panel2)}
.notif .it i{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}
.toasts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;max-width:92vw;pointer-events:none}
.toast{background:#1c2633;border:1px solid #2f5d86;color:#fff;padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
.toast.err{background:#331c22;border-color:#86303f}
.toast button{all:unset;cursor:pointer;color:var(--blue);font-weight:700;padding:2px 6px;pointer-events:auto}
.toast{max-width:min(420px,92vw);pointer-events:none}.toast .tm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.toast.out{opacity:0;transition:opacity .18s}
.sgt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row .btn.sm{white-space:normal;text-align:center;max-width:100%}.sgw{overflow-wrap:anywhere}
.setrow.flash{animation:flash 1.1s var(--ease)}@keyframes flash{0%{background:rgba(47,164,255,.35);border-color:var(--blue)}100%{background:var(--panel2)}}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:70;opacity:0;max-width:260px}
.conn{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:8px}
.conn .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--blue);width:20px;border-radius:4px}
.counter{font-size:30px;font-weight:800}

   1re lettre = type : o/r imbriqué, t/p texte UTF-16BE, u entier 32 bits, s entier 16 bits, b booléen.

/* ===================== ANALYSE AUDIO (BPM, tonalité, énergie) =====================
   Validée sur 12 sons connus : BPM juste sur 11 (le 12e au double), tonalité juste ou voisine dans la plupart des cas. */
function smFFT(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=a+len/2;const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}}
function smAnalyze(ab,maxSec=45){
  const sr0=ab.sampleRate,step=sr0>=88200?4:sr0>=44100?2:1,sr=sr0/step,total=ab.length,take=Math.min(total,Math.floor(maxSec*sr0)),start=Math.max(0,Math.floor((total-take)/2));
  const chs=[];for(let c=0;c<ab.numberOfChannels;c++)chs.push(ab.getChannelData(c));
  const N=Math.floor(take/step),x=new Float32Array(N);for(let i=0;i<N;i++){let s=0;for(const ch of chs)s+=ch[start+i*step];x[i]=s/chs.length;}
  const F=1024,Hh=256,frames=Math.floor((N-F)/Hh);if(frames<200)return null;
  const win=new Float32Array(F);for(let i=0;i<F;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/F);
  const maxBin=Math.min(F/2,Math.floor(8000/(sr/F)));const env=new Float32Array(frames),chroma=new Float64Array(12);
  const F2=4096,pc2=new Int8Array(F2/2).fill(-1),cnt=new Float64Array(12);
  for(let b=1;b<F2/2;b++){const f=b*sr/F2;if(f>=110&&f<=2000){const p=((Math.round(12*Math.log2(f/440))+69)%12+12)%12;pc2[b]=p;cnt[p]++;}}
  const win2=new Float32Array(F2);for(let i=0;i<F2;i++)win2[i]=.5-.5*Math.cos(2*Math.PI*i/F2);
  const re2=new Float64Array(F2),im2=new Float64Array(F2);
  for(let s0=0;s0+F2<N;s0+=2048){for(let i=0;i<F2;i++){re2[i]=x[s0+i]*win2[i];im2[i]=0;}smFFT(re2,im2);const fr=new Float64Array(12);
    for(let b=1;b<F2/2;b++)if(pc2[b]>=0)fr[pc2[b]]+=Math.hypot(re2[b],im2[b])/cnt[pc2[b]];const mx=Math.max(...fr)||1;for(let p=0;p<12;p++)chroma[p]+=fr[p]/mx;}
  let prev=new Float32Array(maxBin),rmsSum=0,cenSum=0,cenW=0;const re=new Float64Array(F),im=new Float64Array(F);
  for(let t=0;t<frames;t++){let e=0;for(let i=0;i<F;i++){const v=x[t*Hh+i];re[i]=v*win[i];im[i]=0;e+=v*v;}rmsSum+=Math.sqrt(e/F);smFFT(re,im);
    let flux=0;const cur=new Float32Array(maxBin);for(let b=1;b<maxBin;b++){const m=Math.hypot(re[b],im[b]);cur[b]=Math.log1p(10*m);const d=cur[b]-prev[b];if(d>0)flux+=d;cenSum+=m*b*sr/F;cenW+=m;}env[t]=flux;prev=cur;}
  const hopSec=Hh/sr,W=Math.round(.5/hopSec),on=new Float32Array(frames);let acc=0;
  for(let t=0;t<frames;t++){acc+=env[t];if(t>=W)acc-=env[t-W];on[t]=Math.max(0,env[t]-acc/Math.min(t+1,W));}
  const ac=l=>{let s=0;for(let i=0;i+l<frames;i++)s+=on[i]*on[i+l];return s/(frames-l);};
  const lagMin=Math.floor(60/200/hopSec),lagMax=Math.ceil(60/60/hopSec);const A=new Float64Array(4*lagMax+4);for(let l=1;l<=4*lagMax+3;l++)A[l]=l<frames-50?ac(l):0;
  const pk=l=>Math.max(A[l-1],A[l],A[l+1]);let best=-1,bestL=0;
  for(let l=lagMin;l<=lagMax;l++){const bpm=60/(l*hopSec),w=Math.exp(-.5*Math.pow(Math.log2(bpm/112)/.9,2)),s=w*(pk(l)+pk(2*l)+pk(3*l)+pk(4*l));if(s>best){best=s;bestL=l;}}
  const y0=A[bestL-1],y1=A[bestL],y2=A[bestL+1],off=(y0-2*y1+y2)!==0?.5*(y0-y2)/(y0-2*y1+y2):0;
  let bpm=60/((bestL+Math.max(-.5,Math.min(.5,off)))*hopSec);while(bpm<75)bpm*=2;while(bpm>=160)bpm/=2;
  const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const corr=(p,r)=>{const a=[],b=[];for(let i=0;i<12;i++){a.push(chroma[(i+r)%12]);b.push(p[i]);}const ma=a.reduce((s,v)=>s+v)/12,mb=b.reduce((s,v)=>s+v)/12;let n=0,da=0,db=0;for(let i=0;i<12;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2;}return n/Math.sqrt(da*db||1);};
  const keys=[];for(let r=0;r<12;r++){keys.push({k:MAJOR[r]+"B",c:corr(MAJ,r)});keys.push({k:MINOR[r]+"A",c:corr(MIN,r)});}keys.sort((a,b)=>b.c-a.c);
  const rmsDb=20*Math.log10(rmsSum/frames+1e-9),onsetRate=on.reduce((s,v)=>s+v,0)/frames,centroid=cenSum/(cenW||1),cl=v=>Math.max(0,Math.min(1,v));
  const raw=.45*cl((rmsDb+16)/8)+.35*cl((onsetRate-8)/17)+.2*cl((centroid-1200)/1600);
  return {bpm:Math.round(bpm*10)/10,key:keys[0].k,keyConf:Math.round((keys[0].c-keys[1].c)*100)/100,energy:Math.max(1,Math.min(10,Math.round(1+raw*9)))};
}

async function decodeBytes(buf){const oc=new OfflineAudioContext(1,44100,44100);return await oc.decodeAudioData(buf);}
async function analyzeFile(file){

}

/* ===================== LECTURE DES TAGS (fichiers ajoutés hors Serato) ===================== */
async function readTags(file){
  const out={t:"",a:"",bpm:null,key:null,genre:"",year:null};
  const base=file.name.replace(/\.[^.]+$/,"");const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m){out.a=m[1].trim();out.t=m[2].trim();}else out.t=base;
  try{const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]===73&&head[1]===68&&head[2]===51){const ver=head[3],size=((head[6]&127)<<21)|((head[7]&127)<<14)|((head[8]&127)<<7)|(head[9]&127);
      const b=new Uint8Array(await file.slice(10,10+Math.min(size,4e6)).arrayBuffer());let o=0;
      const txt=(s,e)=>{const enc=b[s];const d=b.subarray(s+1,e);try{if(enc===1||enc===2){return new TextDecoder(enc===2?"utf-16be":"utf-16").decode(d).replace(/\0/g,"").trim();}return new TextDecoder(enc===3?"utf-8":"latin1").decode(d).replace(/\0/g,"").trim();}catch(e){return "";}};
      while(o+10<b.length){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
        const sz=ver===4?((b[o+4]&127)<<21)|((b[o+5]&127)<<14)|((b[o+6]&127)<<7)|(b[o+7]&127):(b[o+4]<<24)|(b[o+5]<<16)|(b[o+6]<<8)|b[o+7];
        const s=o+10,e=s+sz;if(sz<=0||e>b.length)break;
        if(id==="TIT2")out.t=txt(s,e)||out.t;if(id==="TPE1")out.a=txt(s,e)||out.a;if(id==="TBPM")out.bpm=parseFloat(txt(s,e))||null;
        if(id==="TKEY")out.key=txt(s,e);if(id==="TCON")out.genre=txt(s,e).replace(/^\(\d+\)/,"");if(id==="TYER"||id==="TDRC")out.year=parseInt(txt(s,e))||null;o=e;}}}catch(e){}
  return out;
}

/* CHG-04 : un seul message à la fois, compact, regroupé (« 3 sons ajoutés »), qui ne bloque jamais les clics. */
const TOAST={el:null,group:null,count:0,timer:null};
const GROUP_LABEL={ajout:n=>`${n} sons ajoutés au set`,lib:n=>`${n} sons ajoutés à ta musique`,refus:n=>`${n} sons écartés pour cette session`};
function toast(msg,undo=false,err=false,group=null){
  const box=$("#toasts");
  if(!flag("toast2")){const el=document.createElement("div");el.className="toast"+(err?" err":"");el.innerHTML=`<span>${msg}</span>${undo?'<button onclick="doUndo();this.parentElement.remove()">Annuler</button>':""}`;box.appendChild(el);setTimeout(()=>el.remove(),undo?6000:4200);return;}
  if(group&&TOAST.group===group&&TOAST.el&&TOAST.el.isConnected){TOAST.count++;if(GROUP_LABEL[group])msg=GROUP_LABEL[group](TOAST.count);}else TOAST.count=1;
  box.innerHTML="";const el=document.createElement("div");el.className="toast"+(err?" err":"");
  el.innerHTML=`<span class="tm">${msg}</span>${undo?'<button onclick="doUndo();this.parentElement.remove()">Annuler</button>':""}`;box.appendChild(el);
  TOAST.el=el;TOAST.group=group;clearTimeout(TOAST.timer);
  TOAST.timer=setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),180);if(TOAST.el===el){TOAST.group=null;TOAST.el=null;}},err?4000:2000);}   // l’annulation reste possible ensuite via ↶ ou Ctrl/Cmd+Z

let lastTouch=0;const canHover=()=>matchMedia("(hover:hover) and (pointer:fine)").matches;
function hideTip(){const tp=$("#tip");if(tp)tp.style.opacity=0;}
function placeTip(x,y){const tp=$("#tip"),w=tp.offsetWidth,h=tp.offsetHeight,m=8;
  let L=x+14,T2=y+16;if(L+w>innerWidth-m)L=Math.max(m,x-14-w);if(T2+h>innerHeight-m)T2=Math.max(m,y-12-h);tp.style.left=L+"px";tp.style.top=T2+"px";}
document.addEventListener("touchstart",()=>{lastTouch=Date.now();hideTip();},{passive:true});
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");const tp=$("#tip");
  if(flag("tip2")&&(Date.now()-lastTouch<800||!canHover())){hideTip();return;}
  if(!el){tp.style.opacity=0;return;}tp.textContent=el.dataset.tip;tp.style.opacity=1;if(flag("tip2")&&e.clientX!=null)placeTip(e.clientX,e.clientY);});
document.addEventListener("mousemove",e=>{const tp=$("#tip");if(flag("tip2")){if(tp.style.opacity!=="0")placeTip(e.clientX,e.clientY);return;}tp.style.left=Math.min(e.clientX+14,innerWidth-270)+"px";tp.style.top=(e.clientY+16)+"px";});

/** Transfère l’identité d’un son (apprentissage, set, soirées) vers sa version Serato. */
function mergeInto(from,to){const a=from.n,b=to.n;

  S.gigs.forEach(g=>{g.played=(g.played||[]).map(n=>n===a?b:n);});

async function mapMusic(){

/* 1.12.5 : texte de recherche normalisé gardé en mémoire pour chaque son (pas enregistré), recalculé seulement si le son change */
const _HAY=new WeakMap();
function hayOf(x){const src=[x.t,x.a,x.sg,x.al].filter(Boolean).join(" ");let c=_HAY.get(x);if(!c||c.s!==src){c={s:src,h:normSearch(src)};_HAY.set(x,c);}return c.h;}

    .filter(x=>{if(qVide)return false;if(!words.length)return true;const h=hayOf(x);return words.every(w=>h.includes(w));});
  const [k,d]=S.sort;r.sort((a,b)=>{let A=a[k],B=b[k];if(k==="era"){A=ERA_RANK[a.era];B=ERA_RANK[b.era];}if(k==="k"){A=a.k?kn(a.k)*2+(kl(a.k)==="B"):null;B=b.k?kn(b.k)*2+(kl(b.k)==="B"):null;}const na=A==null||A==="",nb=B==null||B==="";if(na||nb)return na&&nb?0:na?1:-1;if(typeof A==="string"||typeof B==="string")return FRC.compare(String(A),String(B))*d;return (A-B)*d;});

function libTable(){if(!$("#libT"))return;clearTimeout(libTimer);libTimer=null;const r=libRows(),[k,d]=S.sort,ar=c=>k===c?(d>0?" ↑":" ↓"):"";const th=(c,l,cls="")=>`<th class="s ${cls}" onclick="sortBy('${c}')">${l}${ar(c)}</th>`;

function pitch(a,b){let best=[[b,""],[b*2,"double"],[b/2,"moitié"]].map(([v,m])=>({v,m,d:Math.abs(v-a)})).sort((x,y)=>x.d-y.d)[0];

  if(S.dir==="down"&&kl(a)===kl(b)){if(d===10)return [.6,"-2 · baisse d’énergie"];if(d===5)return [.5,"-7 · changement marqué"];}   /* 1.12.4 : en « Descendre », les mêmes transitions vers le bas */

const GW=[["amapiano",x=>x.sg==="Amapiano","amapiano"],["afrobeat",x=>x.sg==="Afrobeats","afrobeats"],["afro",x=>x.g==="Afro","afro"],["rap",x=>x.g==="Hip-hop","rap"],["drill",x=>x.sg==="Drill","drill"],[" r b ",x=>x.g==="R&B","R&B"],["rnb",x=>x.g==="R&B","R&B"],["dancehall",x=>x.sg==="Dancehall","dancehall"],["shatta",x=>x.sg==="Shatta","shatta"],["kompa",x=>x.sg==="Kompa","kompa"],["zouk",x=>x.sg==="Zouk","zouk"],["hits",x=>x.g==="Open format","hits"],["house",x=>x.sg==="House / Dance","house"]];
let _reC={k:null,v:null};   // 1.10.6 : appelée pour chaque son dans compat() ; le résultat ne dépend que du texte des règles
function ruleEffects(rules=S.rules){const key=rules.join("\u0001");if(_reC.k===key)return _reC.v;const ef=[];const lastIx=(re,s)=>{let m,ix=-1;re.lastIndex=0;while((m=re.exec(s)))ix=m.index;return ix;};   // 1.12.1 : la règle la plus récente gagne ; seuls les 3 mots avant le genre comptent ; le mot le plus proche décide, « trop peu / pas assez » = plus
  [...rules].reverse().forEach(r=>{const n=norm(r);GW.forEach(([w,f,l])=>{const i=w.startsWith(" ")?n.indexOf(w):n.search(new RegExp(" "+w+"s?(?= )"));if(i<0)return;const pre=n.slice(0,i).trim().split(" ").slice(-3).join(" ");
  const ip=lastIx(/trop peu|pas assez|manqu|plus|voulai|reclam|demand|assez|envie/g,pre),im=lastIx(/trop|moins/g,pre);
  let sgn=ip<0&&im<0?0:ip>=im?1:-1;
    /* 1.12.4 : « pas envie de rap », « ne veux plus de rap » = on n'en veut pas ; « pas assez / trop peu » restent un manque (donc plus) */
    if(sgn===1&&!/^(trop peu|pas assez)/.test(pre.slice(ip))){const p6=n.slice(0,i).trim().split(" ").slice(-6).join(" ");if(/(^| )(ne|n|pas|jamais|aucun|aucune)( |$)/.test(p6))sgn=-1;}if(sgn&&!ef.some(e=>e.l===l))ef.push({f,sgn,l});});});_reC={k:key,v:ef};return ef;}
function compat(cur,c,full=true){

  const days=c.lastPlayed&&c.lastPlayed<=Date.now()?Math.round((Date.now()-c.lastPlayed)/864e5):null;   // 1.12.1 : une date future (soirée à venir) n'est pas « joué il y a -3 j »
  if(days!=null&&days<14){s+=.05;why.push(["warn",`Joué il y a ${days} j`]);}else{s+=.2;why.push(["ok",days==null?"Pas joué récemment":`Pas joué depuis ${days} j`]);}

const SESS={shown:{},dismissed:{},cool:{},log:[]};

  if(flag("toast2"))toast(`« ${esc(T(n).t)} » ajouté au set`,true,false,"ajout");else toast(`« ${esc(T(n).t)} » ajouté. Suggestions recalculées.`,true);
  setTimeout(()=>{if(S.flash===n)S.flash=null;},1200);}
function mv(n,d){const a=S.set.ids,i=a.indexOf(n);if(i<0)return;const j=i+d;if(j<0||j>=a.length)return;const o=snapSet(),wasLast=S.cur===a[a.length-1];[a[i],a[j]]=[a[j],a[i]];if(wasLast)S.cur=a[a.length-1];pushUndo("déplacement dans le set",()=>restoreSet(o));save();render();}
function rmSet(n){const i=S.set.ids.indexOf(n);if(i<0)return;const o=snapSet();S.set.ids.splice(i,1);if(!S.set.ids.length)S.set.ids=[o[0]];S.cur=S.set.ids[S.set.ids.length-1];pushUndo("retrait du set",()=>restoreSet(o));save();render();}
function clearSet(){const o=snapSet();S.set.ids=[S.cur];pushUndo("vidage du set",()=>restoreSet(o));save();render();toast("Set vidé.",true);}
/** Sons du set qui ont un fichier (les « à récupérer » sont mis de côté, avec un message). */
function setFiles(){const all=S.set.ids.map(T).filter(Boolean),ok=all.filter(t=>!t.wish),miss=all.length-ok.length;

/* 1.10 · Chemins M3U selon l'ordinateur de destination. Mesuré le 07/11/2026 sur Serato DJ Pro 5.0 (Windows) :
   « /Users/... » sans lettre de disque = import refusé ; « C:/Users/... » et « C:\\Users\\... » = import réussi. */
const m3uCfg=()=>(S.m3u&&typeof S.m3u==="object"&&!Array.isArray(S.m3u)&&(S.m3u.os==="win"||S.m3u.os==="mac"))?S.m3u:(S.m3u={os:(/Macintosh|Mac OS X/i.test(navigator.userAgent)&&!/iPhone|iPad|iPod/i.test(navigator.userAgent)&&!(navigator.maxTouchPoints>1))?"mac":"win",drive:"C"});
function m3uLine(p,cfg){const c=cfg||m3uCfg(),q=relPath(p);return c.os==="win"?(c.drive||"C").toUpperCase()+":\\"+q.replace(/\//g,"\\"):"/"+q;}
function m3uText(items,cfg){return "#EXTM3U\n"+items.map(x=>`#EXTINF:-1,${[x.a,x.t].filter(Boolean).join(" - ").replace(/[\r\n]+/g," ")||relPath(x.path).split("/").pop()}\n${m3uLine(x.path,cfg)}`).join("\n")+"\n";}
/** Demande pour quel ordinateur est la playlist (un appui), puis lance l'export. */

  modal(`<h2>Pour quel ordinateur est cette playlist ?</h2><p class="hint mt2">Le fichier doit contenir le chemin des morceaux tel que <b>l’ordinateur qui l’ouvre</b> le comprend. Sur Windows il faut la lettre du disque : sans elle, Serato 5.0 refuse toute la playlist (mesuré). Les morceaux doivent être au même endroit sur cet ordinateur.</p>
   <div class="grid g2 mt" style="gap:8px"><button class="btn ${c.os==="win"?"":"ghost"}" id="m3w">Windows</button><button class="btn ${c.os==="mac"?"":"ghost"}" id="m3m">Mac</button></div>
   <label class="hint mt" style="display:block">Lettre du disque pour Windows : <input id="m3d" maxlength="1" value="${esc(c.drive||"C")}" style="width:2.2em;text-transform:uppercase;text-align:center;font-size:16px"></label>`);
  const go=os=>{const d=(($("#m3d").value||"C").trim().toUpperCase().match(/[A-Z]/)||["C"])[0];S.m3u={os,drive:d};save();closeModal();then();};

function exportM3U(){const items=setFiles();if(!items.length)return;const fname=safeName(S.set.name)+".m3u8",left=S.set.ids.map(T).filter(t=>t&&t.wish).length;

function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const safeName=s=>{let t=Array.from(String(s||"Sans nom").replace(/[\/\\:*?"<>|%]/g,"-").replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim()).slice(0,80).join("").replace(/[. ]+$/,"").trim();if(/^(con|prn|aux|nul|com\d|lpt\d)(\..*)?$/i.test(t))t="_"+t;return t||"Sans nom";};

function stepsUI(title,steps){modal(`<h2>${title}</h2><div class="mt">${steps.map((s,i)=>`<div class="step" id="st${i}"><div class="st"></div><span>${esc(s)}</span></div>`).join("")}</div><div id="stEnd"></div>`);
  return {run:i=>{const e=$("#st"+i);if(e)e.className="step run";},ok:(i,txt)=>{const e=$("#st"+i);if(e){e.className="step done";e.querySelector(".st").textContent="✓";if(txt)e.querySelector("span").textContent=txt;}},
    err:(i,txt)=>{const e=$("#st"+i);if(e){e.className="step err";e.querySelector(".st").textContent="!";e.querySelector("span").textContent=txt;}},end:h=>{$("#stEnd").innerHTML=h;}};}
async function exists(dir,name){try{await dir.getFileHandle(name);return true;}catch(e){return false;}}
async function writeFile(dir,name,bytes){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(bytes);await w.close();}
async function readFile(dir,name){return new Uint8Array(await (await (await dir.getFileHandle(name)).getFile()).arrayBuffer());}
async function backupFile(root,dir,name){const bk=await root.getDirectoryHandle("SetMate sauvegardes",{create:true});const stamp=new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
  await writeFile(bk,stamp+" "+name,await readFile(dir,name));return stamp+" "+name;}
/** Écrit des crates "SetMate%%<nom>.crate" dans <root>/Subcrates. Ne touche jamais une crate qui n’a pas été créée par SetMate. */
async function writeCrates(root,list,volumeTag){
  const sub=await root.getDirectoryHandle("Subcrates",{create:true});const res=[];
  if(!(await exists(sub,"SetMate.crate")))await writeFile(sub,"SetMate.crate",buildCrate([]));
  for(const {name,paths} of list){let file=`SetMate%%${safeName(name)}.crate`;let backup=null;
    const mine=S.created.find(c=>c.vol===volumeTag&&(c.file===file||c.name===name));if(mine)file=mine.file;   /* 1.12.4 : on retrouve sa propre crate par son nom, sinon elle se recréait en (2), (3)… */
    if(await exists(sub,file)){if(mine)backup=await backupFile(root,sub,file);else{let i=2;while(await exists(sub,`SetMate%%${safeName(name)} (${i}).crate`))i++;file=`SetMate%%${safeName(name)} (${i}).crate`;}}
    await writeFile(sub,file,buildCrate(paths));
    const back=crateTracks(await readFile(sub,file));if(back.length!==paths.length)throw new Error(`vérification échouée pour ${file}`);
    if(!mine)S.created.push({file,vol:volumeTag,name,date:Date.now(),count:paths.length});else{mine.date=Date.now();mine.count=paths.length;}
    res.push({file,count:paths.length,backup});}
  save();return {sub,res};
}
async function removeCreated(sub,files,vol){for(const f of files){try{await sub.removeEntry(f);}catch(e){}S.created=S.created.filter(c=>!(c.file===f&&c.vol===vol));}save();}

/** Copie des fichiers du set dans un dossier (un fichier manquant ne bloque pas le reste). */
/** Nom de destination unique dans ce lot : deux sons au même nom de fichier ne s'écrasent plus (le 2e reçoit son numéro devant). */
function uniqName(used,name,i){let nm=name;if(used.has(nm.toLowerCase()))nm=String(i+1).padStart(2,"0")+" - "+name;let k=2;while(used.has(nm.toLowerCase()))nm=String(i+1).padStart(2,"0")+"-"+(k++)+" - "+name;used.add(nm.toLowerCase());return nm;}
async function copyFiles(dest,items,onStep,numbered){const copied=[],lost=[],used=new Set();let skipped=0;
  for(let i=0;i<items.length;i++){const x=items[i];const f=await fileOf(x);if(!f){lost.push(x.t);continue;}
    const nm=uniqName(used,numbered?String(i+1).padStart(2,"0")+" - "+f.name:f.name,i);let same=false;try{const ex=await (await dest.getFileHandle(nm)).getFile();same=ex.size===f.size;}catch(e){}
    if(!same){const fh=await dest.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(f);await w.close();}else skipped++;
    copied.push({x,name:nm});if(onStep)onStep(i,x);}
  return {copied,lost,skipped};}
async function exportFolder(){const items=setFiles();if(!items.length)return;

    let n=0;const nomsOk=new Set(r.copied.map(c=>c.name));let vieux=0;for await(const [k] of dest.entries()){n++;if(!nomsOk.has(k))vieux++;}ui.ok(1,`Relu : ${pl(n,"fichier")} dans le dossier${vieux?` dont ${vieux} ancien${vieux>1?"s":""} d’une copie précédente. Je n’ai rien supprimé : retire-${vieux>1?"les":"le"} à la main avant de glisser le dossier dans Serato.`:""}`);

async function writeRuleCrates(){

  if(!S.demo&&!(await seratoGate()))return seratoAlternatives("crates");

function parseCSV(txt){const rows=[];let row=[],cell="",q=false;const sep=(txt.split("\n")[0].match(/;/g)||[]).length>(txt.split("\n")[0].match(/,/g)||[]).length?";":",";
  for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell="";}else if(c==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell="";}else cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()));}

function histParse(txt,name,mtime){

  modal(`<h2>Historique importé</h2><p class="mt2"><b>${pl(uniq.length,"son")}</b> reconnu${uniq.length>1?"s":""} et relié${uniq.length>1?"s":""} à « ${esc(g.lieu)} ».</p>${miss.length?`<p class="hint mt2">${pl(miss.length,"ligne")} non reconnue${miss.length>1?"s":""} : ${esc(miss.slice(0,6).join(" · "))}${miss.length>6?"…":""}</p>`:""}

const SOURCES=[{id:"pl:1109890291",l:"Top France",g:null},{id:"chart:116",l:"Rap / Hip-hop",g:"rap"},{id:"chart:2",l:"Musique africaine",g:"afro"},{id:"chart:165",l:"R&B",g:"rnb"},{id:"pl:5964916564",l:"Amapiano",g:"amapiano"},{id:"chart:132",l:"Pop",g:"pop"}];

function jsonp(url,ms=8000){return new Promise((res,rej)=>{const cb="dz"+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement("script");const clean=late=>{clearTimeout(to);s.remove();if(late){window[cb]=()=>{};setTimeout(()=>{delete window[cb]},60000);}else delete window[cb];};   /* 1.12.1 : après un délai dépassé, une réponse tardive tombe dans une fonction vide au lieu de lever une erreur */
  const to=setTimeout(()=>{clean(true);rej(new Error("délai dépassé"))},ms);window[cb]=d=>{clean();d&&d.error?rej(new Error(d.error.message||"erreur Deezer")):res(d)};s.onerror=()=>{clean();const er=new Error(navigator.onLine===false?"pas de connexion internet":"Deezer est bloqué par ton navigateur ou ton réseau (bloqueur de pub, filtre d’entreprise ?)");er.bloque=navigator.onLine!==false;rej(er)};
  s.src=url+(url.includes("?")?"&":"?")+"output=jsonp&callback="+cb;document.body.appendChild(s);});}

const WHY={moi:"Ajouté par toi",decouverte:"Pépite ajoutée",tendance:"Tendance ajoutée",soiree:"Demandé en soirée"};

function addToLib(x,src="moi"){
  const m=libMatch(x);if(m){if(m.wish&&src==="soiree"){m.src="soiree";m.why=WHY.soiree;}return {t:m,isNew:false};}
  const c=S.trendCache[x.dz],[g,sg,conf]=classifyOnline(x);
  const t={n:S.nextN++,path:"wish/"+x.dz,wish:true,dz:x.dz,cover:x.cover,t:x.t,a:x.a,src,why:WHY[src]||WHY.moi,bpm:c?.bpm||null,bpmSrc:"est",k:c?.k||null,kSrc:"est",e:c?.e||null,

}
async function fetchGenre(t){try{const d=await jsonp(`https://api.deezer.com/track/${t.dz}`);if(!d.album)return;const al=await jsonp(`https://api.deezer.com/album/${d.album.id}`);
  const name=al.genres&&al.genres.data&&al.genres.data[0]&&al.genres.data[0].name;if(!name||t.manual)return;const [g,sg,conf]=classify(name,t.a);
  if(g!=="?"){t.g=g;t.sg=sg;t.conf=Math.min(conf,80);t.genreTag=name;save(true);liveRefresh();}}catch(e){}}
function removeFromLib(t){S.tracks=S.tracks.filter(x=>x!==t);delete S.L[t.n];S.set.ids=S.set.ids.filter(n=>n!==t.n);if(S.cur===t.n)S.cur=S.set.ids[S.set.ids.length-1]||null;reindex();}
function liveRefresh(){renderNav();const a=document.activeElement&&document.activeElement.id;if(!$(".ov")&&a!=="trQ"&&a!=="pickQ"&&["trend","next","home","lib","listen"].includes(S.screen))softRender();}
function findDz(dz){return S.trends.items.find(x=>x.dz===dz)||(S.disc.items||[]).find(x=>x.dz===dz)||(S.disc.extra||[]).find(x=>x.dz===dz)||(S.search.items||[]).find(x=>x.dz===dz)||(S.found||{})[dz]||S.tracks.find(t=>t.dz===dz)||plFind(dz);}
function addIdea(dz){const x=findDz(dz);if(!x)return;
  const src=(S.disc.items||[]).some(y=>y.dz===dz)?"decouverte":S.trends.items.some(y=>y.dz===dz)?"tendance":"moi";
  const {t,isNew}=addToLib(x,src);if(!isNew){toast(`« ${esc(x.t)} » est déjà dans ta musique.`);return;}
  // la découverte se renouvelle : le son ajouté laisse sa place à un nouveau
  const di=(S.disc.items||[]).findIndex(y=>y.dz===dz);let repl=null;if(di>=0){repl=pickDisc();S.disc.items.splice(di,1,...(repl?[repl]:[]));}
  pushUndo("ajout à ta musique",()=>{removeFromLib(t);if(di>=0){S.disc.items=S.disc.items.filter(y=>y!==repl);S.disc.items.splice(di,0,x);}});

function addAll(kind){const on=new Set(STYLES.filter(([k])=>S.styles[k]).map(x=>x[1]));
  const list=kind==="disc"?(S.disc.items||[]).filter(x=>on.has(x.style)):kind==="search"?(S.search.items||[]):S.trends.items;
  const added=[];for(const x of list){const {t,isNew}=addToLib(x,kind==="disc"?"decouverte":kind==="moment"?"tendance":"moi");if(isNew)added.push(t);}
  if(!added.length){toast("Tout est déjà dans ta musique.");return;}
  const old=kind==="disc"?[...S.disc.items]:null;if(kind==="disc"){S.disc.items=[];refillDisc(30);}
  pushUndo(`ajout de ${added.length} sons`,()=>{added.forEach(removeFromLib);if(old)S.disc.items=old;});
  save(true);toast(`${pl(added.length,"son")} ajouté${added.length>1?"s":""} à ta musique.${kind==="disc"?" Voici de nouvelles pépites.":""}`,true);liveRefresh();}
function rmWish(n){const t=T(n);if(!t)return;const idx=S.set.ids.indexOf(t.n),L=S.L[t.n],wasCur=S.cur===t.n;removeFromLib(t);const curAfter=S.cur;pushUndo("retrait de ta musique",()=>{S.tracks.push(t);reindex();if(L)S.L[t.n]=L;if(idx>=0&&!S.set.ids.includes(t.n))S.set.ids.splice(Math.min(idx,S.set.ids.length),0,t.n);if(wasCur&&S.cur===curAfter)S.cur=t.n;});save(true);liveRefresh();}
function clearUpgrade(n){const t=T(n);if(!t)return;t.upgrade=false;pushUndo("retrait",()=>{t.upgrade=true;});save(true);liveRefresh();}

/* ---------- Du moment ---------- */
let trBusy=false;
async function refreshTrends(silent){
  if(trBusy)return;trBusy=true;if(!silent)softRender();
  const agg=new Map();let ok=0;
  for(const s of SOURCES.filter(s=>!s.g||S.genres[s.g])){try{const [k,id]=s.id.split(":");const d=await jsonp(k==="pl"?`https://api.deezer.com/playlist/${id}/tracks?limit=50`:`https://api.deezer.com/chart/${id}/tracks?limit=50`);ok++;
    (d.data||[]).forEach((t,i)=>{const e=agg.get(t.id)||{...dzItem(t),score:0,srcs:[]};e.score+=(51-i)/50;e.srcs.push(s.l);agg.set(t.id,e);});}catch(e){}}
  const need=SOURCES.filter(s=>!s.g||S.genres[s.g]).length;
  if(ok&&ok<need&&S.trends.items.length){if(!silent)toast("Classements incomplets : je garde les précédents.",false,true);trBusy=false;if(["trend","home","next"].includes(S.screen))liveRefresh();return;}   /* un classement partiel ne remplace pas le complet */
  if(ok){const prev={};S.trends.items.forEach(x=>prev[x.dz]=x.pos);
    const items=[...agg.values()].sort((a,b)=>b.score-a.score).slice(0,40).map((x,i)=>({...x,pos:i+1,prev:prev[x.dz]||null}));
    S.trends={date:ok<need?(S.trends.date||0):Date.now(),items};save();notify(`Nouveautés prêtes : ${items.filter(x=>!libMatch(x)).length} sons que tu n’as pas`,"trend");analyzeQueue(items);}
  else if(!silent)toast("Impossible de joindre Deezer. Vérifie ta connexion internet.",false,true);
  trBusy=false;if(["trend","home","next"].includes(S.screen))liveRefresh();
}

/* ---------- Découverte : flux sans fin ---------- */
const VARIANTS=()=>{const y=new Date().getFullYear();return [""," "+y," new"," hits"," underground"," mix"," "+(y-1)," club"," vibes"," session"," fresh"," 2000s"];};
async function fetchDiscBatch(style,label){
  S.disc.qi=S.disc.qi||{};S.disc.usedPl=S.disc.usedPl||[];const i=S.disc.qi[style]||0;S.disc.qi[style]=i+1;const v=VARIANTS();
  const pls=await jsonp(`https://api.deezer.com/search/playlist?q=${encodeURIComponent((style+v[i%v.length]).trim())}&limit=12&index=${(Math.floor(i/v.length)%8)*12}`);
  const cand=(pls.data||[]).filter(p=>p.nb_tracks>=15&&!S.disc.usedPl.includes(p.id));if(!cand.length)return [];
  const pl=cand[Math.floor(Math.random()*Math.min(cand.length,6))];S.disc.usedPl.push(pl.id);if(S.disc.usedPl.length>500)S.disc.usedPl.splice(0,100);
  const d=await jsonp(`https://api.deezer.com/playlist/${pl.id}/tracks?limit=100`);
  const seen=new Set(S.disc.seen||[]),popular=new Set(S.trends.items.map(x=>x.dz));
  const out=(d.data||[]).filter(t=>t.preview&&!seen.has(t.id)&&!popular.has(t.id)).map(t=>({...dzItem(t),style:label,peu:(t.rank||0)<PEU_CONNU})).filter(x=>!libMatch(x));
  S.disc.seen=[...(S.disc.seen||[]),...out.map(x=>x.dz)].slice(-5000);return out;}
let discBusy=false,topUpP=null;
/** Remplit la réserve de pépites. Si un remplissage tourne déjà, on attend le même (pas de double appel). */
function topUpExtra(min=40){if(topUpP)return topUpP;const styles=STYLES.filter(([k])=>S.styles[k]);if(!styles.length)return Promise.resolve();
  const sig=styles.map(s=>s[0]).join();discBusy=true;topUpP=(async()=>{try{const per=Math.max(8,Math.ceil(min/styles.length));   // chaque style a sa part de la réserve
    for(const [k,l] of shuffle([...styles])){let tries=0;while((S.disc.extra||[]).filter(x=>x.style===l&&!libMatch(x)).length<per&&tries<4){tries++;try{S.disc.extra=[...(S.disc.extra||[]),...shuffle(await fetchDiscBatch(k,l))];}catch(e){}}}}
    finally{discBusy=false;topUpP=null;save();if(STYLES.filter(([k])=>S.styles[k]).map(s=>s[0]).join()!==sig)topUpExtra(min);}})();return topUpP;}   // 1.10.6 : si les styles cochés ont changé pendant le chargement, un second passage complète
function pickDisc(){const ex=S.disc.extra||[];const on=new Set(STYLES.filter(([k])=>S.styles[k]).map(x=>x[1]));
  let pool=ex.filter(x=>on.has(x.style)&&!libMatch(x)&&!(S.disc.items||[]).some(y=>y.dz===x.dz));if(!pool.length){topUpExtra();return null;}
  const peu=pool.filter(x=>x.peu);if(peu.length&&Math.random()<.7)pool=peu;                       // 7 fois sur 10 : un son peu connu
  // varier les styles : on tire d’abord le style le moins présent à l’écran, puis un son au hasard dedans
  const shown={};(S.disc.items||[]).forEach(y=>shown[y.style]=(shown[y.style]||0)+1);const styl=[...new Set(pool.map(y=>y.style))];
  const minC=Math.min(...styl.map(s=>shown[s]||0));const pickS=shuffle(styl.filter(s=>(shown[s]||0)===minC))[0];pool=pool.filter(y=>y.style===pickS);
  const x=pool[Math.floor(Math.random()*pool.length)];S.disc.extra=ex.filter(y=>y!==x);analyzeQueue([x]);if(S.disc.extra.length<25)topUpExtra();return x;}
function refillDisc(n){let k=0;for(let i=0;i<n;i++){const x=pickDisc();if(!x)break;S.disc.items.push(x);k++;}return k;}
async function loadDiscovery(silent){S.disc.items=[];if(!silent)softRender();await topUpExtra(60);refillDisc(30);S.disc.date=Date.now();save();
  if(!S.disc.items.length&&!silent)toast("Pas de pépites trouvées. Vérifie ta connexion ou choisis d’autres styles.",false,true);if(["trend","next","home"].includes(S.screen))liveRefresh();}
async function moreDisc(){let n=refillDisc(15);
  for(let r=0;r<4&&n<15;r++){softRender();await topUpExtra(40);n+=refillDisc(15-n);if(n<15&&r<3)await sleep(2500);}
  save();liveRefresh();
  if(!n)toast(!navigator.onLine?"Pas de réseau : la découverte reprendra dès que tu es connecté.":"Deezer ne m’a rien renvoyé après plusieurs essais. Réessaie dans une minute.",false,true);}
function toggleStyle(k){S.styles[k]=S.styles[k]?0:1;save();loadDiscovery();}

/* ---------- Analyse des extraits ---------- */
let anaSince=0;
async function analyzeDz(x){if(S.trendCache[x.dz])return S.trendCache[x.dz];
  try{const d=await jsonp(`https://api.deezer.com/track/${x.dz}`,8000,"low");if(!d.preview)return null;
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),10000);/* 1.10.5 : un extrait qui ne répond pas est abandonné au bout de 10 s au lieu de bloquer toute l'analyse */
    const buf=await (await fetch(d.preview,{signal:ac.signal})).arrayBuffer();clearTimeout(tm);const r=await analyzeOff(await decodeBytes(buf),30);
    if(r){S.trendCache[x.dz]={bpm:r.bpm,k:r.key,e:r.energy,kc:r.keyConf};anaFail.delete(x.dz);const keys=Object.keys(S.trendCache);if(keys.length>3000)keys.slice(0,500).forEach(k=>delete S.trendCache[k]);anaSince++;if(anaSince>=5||!anaQ.length){anaSince=0;save();}return S.trendCache[x.dz];}}catch(e){}anaFail.set(x.dz,Date.now());return null;}   // 1.10.6 : une sauvegarde complète toutes les 5 analyses (ou en fin de file), pas à chaque son
const anaQ=[];let anaQRun=false;
/* 1.10.6 : les échecs sont gardés en mémoire seulement (pas dans la sauvegarde) et expirent au bout de 5 min ; hors-ligne on ne relance rien */
const anaFail=new Map(),anaPrio=new Set();
const anaSkip=dz=>{const t=anaFail.get(dz);if(t===undefined)return false;if(Date.now()-t>300000){anaFail.delete(dz);return false;}return true;};
function analyzeQueue(list,prio){if(typeof navigator!=="undefined"&&navigator.onLine===false)return;const add=[];list.forEach(x=>{if(!x||S.trendCache[x.dz]||anaSkip(x.dz))return;const i=anaQ.findIndex(y=>y.dz===x.dz);if(i>=0){if(!prio)return;anaQ.splice(i,1);}add.push(x);});
  if(prio){add.forEach(x=>anaPrio.add(x.dz));anaQ.unshift(...add);}else anaQ.push(...add);if(!anaQRun)runAnaQ();}
async function runAnaQ(){anaQRun=true;let n=0;try{while(anaQ.length){while(!calm())await sleep(250);const x=anaQ.shift();anaPrio.delete(x.dz);try{await analyzeDz(x);}catch(e){}n++;if(n%6===0)liveRefresh();await sleep(250);}}finally{anaQRun=false;}liveRefresh();}

/* ---------- Recherche libre ---------- */
let searchSeq=0;/* 1.10.5 : une réponse plus ancienne ne doit jamais écraser une recherche plus récente */
async function doSearch(q){q=(q||"").trim();const my=++searchSeq;S.search={q,items:[],busy:!!q};softRender();if(!q)return;
  try{const d=await jsonp(`https://api.deezer.com/search?q=${encodeURIComponent(q)}&limit=25`);if(my!==searchSeq)return;S.search={q,items:(d.data||[]).filter(t=>t.preview).map(t=>({...dzItem(t),peu:(t.rank||0)<PEU_CONNU})),busy:false};analyzeQueue(S.search.items.slice(0,12),true);}
  catch(e){if(my!==searchSeq)return;S.search={q,items:[],busy:false,err:e.message};}
  softRender();}

VIEWS.trend=()=>{
  const it=S.trends.items,on=new Set(STYLES.filter(([k])=>S.styles[k]).map(x=>x[1])),dsc=(S.disc.items||[]).filter(x=>on.has(x.style)),tab=S.trTab||"moment";

function openTab(k){if(k==="decouverte"&&!(S.disc.items||[]).length&&!discBusy)loadDiscovery();else if(k==="moment"&&!S.trends.items.length&&!trBusy)refreshTrends();else softRender();}
/* ===================== SURVEILLANCE DES TÉLÉCHARGEMENTS =====================
   Un fichier qui arrive est comparé aux sons « à récupérer » : s’il correspond, le son existant est relié au fichier
   (il garde ce qui a été appris, sa place dans le set et dans les soirées). Sinon, il est ajouté comme nouveau son. */
let watchT=null;const AUDIO=/\.(mp3|m4a|aac|wav|aiff?|flac|ogg|alac)$/i;
function startWatch(){clearInterval(watchT);if(H.dl&&PERM.dl==="granted"){scanDl();watchT=setInterval(scanDl,60000);}}
const arrivals=[];var CURARR=null,SCANNING=false;
/* 1.12.4 : un titre court contenu dans un autre (« Love » dans « Love Me ») ne suffit plus : le titre doit être le même, avec au plus une mention de version */
function titleEq(src,bt,ma,file){const b=String(bt||"").trim();if(!b)return false;
  const VER=/^(remix|extended|edit|version|mix|original|radio|clean|dirty|explicit|feat|ft|featuring|with|prod|intro|remaster|remastered|instrumental|club|live|official|audio|video|lyrics|hd|hq|\d+|kbps)( |$)/;
  const okRest=r=>{r=r.trim();return !r||VER.test(r);};
  const one=p=>{const s=norm(p).trim();if(!s)return false;for(const v of [s,s.replace(/^\d{1,3} /,"")]){if(v===b)return true;if(v.startsWith(b+" ")&&okRest(v.slice(b.length)))return true;}return false;};
  if(!file)return one(src);

async function playTrack(n,force=false){const x=T(n);const u="t"+n;PFAIL=false;if(!x){PFAIL=true;return stopPlay();}if(!force&&PL&&PL.u===u)return stopPlay();if(!force)Q.items=[];stopPlay();PL={u,x,src:"…"};renderPlayer();refreshPlay();

  else if(x.dz){try{const d=await jsonp(`https://api.deezer.com/track/${x.dz}`);if(PL?.u!==u)return;if(!d.preview)throw new Error("pas d’extrait");AU.src=d.preview;PL.src="extrait 30 s · Deezer";}catch(e){if(PL?.u!==u)return;PFAIL=true;previewFail();return stopPlay();}}
  else{const p=await dzSearch(x);if(PL?.u!==u)return;if(!p){PFAIL=true;toast("Pas d’extrait disponible. Connecte ton dossier Musique pour écouter tes fichiers.",false,true);return stopPlay();}AU.src=p.preview;PL.src="extrait 30 s · Deezer";if(p.cover)x.cover=x.cover||p.cover;}
  try{await AU.play();}catch(e){if(PL?.u!==u)return;PFAIL=true;toast("Lecture impossible : "+esc(e.message),false,true);return stopPlay();}startProg();renderPlayer();refreshPlay();}
async function dzSearch(x){const k=x.a+"|"+x.t;const c0=DZC[k];if(c0&&Date.now()-c0.t<(c0.none?60e3:8*60e3))return c0.none?null:c0;try{const art=String(x.a).split(/,|&| feat/i)[0].trim(),tit=String(x.t).replace(/\(.*\)/,"").trim();
  const d=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent(art+" "+tit)+"&limit=5");const a0=norm(art).trim(),t0=norm(tit).trim(),inc=(a,b)=>!!a&&!!b&&(" "+a+" ").includes(" "+b+" ");
  const r=(d.data||[]).find(it=>{if(!it.preview)return false;const an=norm(it.artist?.name).trim(),tn=norm(it.title_short||it.title).trim(),tf=norm(it.title).trim();return a0&&(inc(an,a0)||inc(a0,an))&&t0&&(inc(tn,t0)||inc(t0,tn)||inc(tf,t0));});DZC[k]=r?{preview:r.preview,cover:r.album?.cover_medium,t:Date.now()}:{none:true,t:Date.now()};}catch(e){return null;}   /* une erreur de réseau n'est pas mémorisée */const c1=DZC[k];return c1.none?null:c1;}
async function playDz(dz,force=false,meta=null){const u="dz"+dz;PFAIL=false;if(!force&&PL&&PL.u===u)return stopPlay();if(!force)Q.items=[];stopPlay();const it=meta||findDz(dz)||{t:"…",a:""};PL={u,x:{dz,t:it.t,a:it.a,cover:it.cover,k:S.trendCache[dz]?.k,bpm:S.trendCache[dz]?.bpm},src:"…"};renderPlayer();refreshPlay();

function startProg(){clearInterval(progT);progT=setInterval(()=>{const b=$("#pbar");if(b&&AU.duration)b.style.width=(AU.currentTime/AU.duration*100)+"%";},250);}

const Q={items:[],i:-1,shuffle:false,repeat:"off",label:"",fails:0,played:new Set()};
const qKey=it=>it.n?"t"+it.n:it.fid?"f"+it.fid:"dz"+it.dz;
const inQueue=()=>!!(Q.items.length&&PL&&Q.items[Q.i]&&PL.u===qKey(Q.items[Q.i]));
let qTok=0;
function qStart(items,i=0,label="",rand=false){Q.items=items.filter(Boolean);Q.label=label;Q.fails=0;Q.played=new Set();
  if(!Q.items.length)return toast("Rien à écouter ici pour l’instant.",false,true);
  if(rand){Q.shuffle=true;i=Math.floor(Math.random()*Q.items.length);}qPlay(Math.min(i,Q.items.length-1));}
async function qPlay(i){if(i<0||i>=Q.items.length)return stopPlay();const tok=++qTok;Q.i=i;Q.played.add(i);const it=Q.items[i];
  if(it.n&&!T(it.n)){Q.items.splice(i,1);if(i>=Q.items.length)return stopPlay();return qPlay(i);}   // son retiré de la bibliothèque : on l'enlève de la file
  PFAIL=false;if(it.n)await playTrack(it.n,true);else if(it.fid)await playOwn(it.fid,true);else await playDz(it.dz,true,it);
  if(tok!==qTok)return;
  // un extrait indisponible ne bloque pas la file : on passe au suivant (3 essais au plus)
  if(!PL){if(PFAIL&&++Q.fails<4&&Q.items.length>1)return qNext();}else Q.fails=0;}
function qPrev(){if(AU.currentTime>3){AU.currentTime=0;return;}qPlay(Math.max(0,Q.i-1));}
function qToggle(){if(!PL){if(Q.items.length)qPlay(Math.max(0,Q.i));return;}if(AU.paused)AU.play().catch(()=>{});else AU.pause();renderPlayer();}

function seekBar(e,el){if(!AU.duration)return;const r=el.getBoundingClientRect();AU.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*AU.duration;}

function splitRow(l,sep){if(sep==="\t")return l.split("\t");const r=[];let cur="",q=false;
  for(let i=0;i<l.length;i++){const c=l[i];if(q){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===sep){r.push(cur);cur="";}else cur+=c;}r.push(cur);return r;}

function parseList(text){const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/).map(l=>l.trim()).filter(Boolean);
  const out=[],seen=new Set(),push=(t,a)=>{t=String(t||"").trim();a=String(a||"").trim();if(!t)return;const k=norm(a+" "+t);if(seen.has(k))return;seen.add(k);out.push({t,a});};
  if(!lines.length)return out;const head=lines[0].toLowerCase();
  if(head.startsWith("#extm3u")||lines.some(l=>/^#EXTINF/i.test(l))){let inf=null;
    for(const l of lines){if(/^#EXTINF/i.test(l)){inf=l.replace(/^#EXTINF:[^,]*,/i,"");continue;}if(l.startsWith("#"))continue;const m=parseName(inf||l.split(/[\\/]/).pop());push(m.t,m.a);inf=null;}return out;}
  const sep=head.includes("\t")?"\t":/(track|titre|title|name|nom)/.test(head)&&head.includes(",")?",":/(track|titre|title|name|nom)/.test(head)&&head.includes(";")?";":null;
  if(sep){const rows=lines.map(l=>splitRow(l,sep)),h=rows[0].map(c=>c.toLowerCase().trim());
    const ti=h.findIndex(c=>/^(name|nom|titre|title|track name|track|song|morceau)$/.test(c)),ai=h.findIndex(c=>/^(artist|artiste|artist name\(s\)|artist name|artists|artistes|interprète)$/.test(c));
    if(ti>=0){rows.slice(1).forEach(r=>push(r[ti],ai>=0?String(r[ai]||"").split(/;|\|/)[0]:""));return out;}
    if(sep==="\t"){rows.forEach(r=>{const d=r.findIndex(c=>/^\d{1,2}:\d{2}(:\d{2})?$/.test(c.trim()));push(r[0],d>=0?r[d+1]:r[1]);});return out;}}
  for(const l of lines){if(/^https?:\/\//i.test(l))continue;const s=l.replace(/^\s*\d{1,3}\s*[.)-]\s+/,""),m=s.split(/\s+[-–—]\s+/);
    if(m.length>1)push(m.slice(1).join(" - "),m[0]);else{const b=s.split(/\s+·\s+/);   /* 1.12.4 : « Stand by Me » n'est plus coupé en titre « Stand » et artiste « Me » */b.length>1?push(b[0],b[1]):push(s,"");}}
  return out;}
/** Retrouve un son sur Deezer à partir de son titre et de son artiste ; essaie aussi l’ordre inverse. */
async function dzMatch(x,swapped=false){const art=String(x.a||"").split(/,|&| feat| ft\.| x /i)[0].trim(),tit=String(x.t||"").replace(/\(.*?\)|\[.*?\]/g,"").trim();
  if(!tit)return null;let best=null,bs=0;
  try{const d=await jsonp("https://api.deezer.com/search?q="+encodeURIComponent((art+" "+tit).trim())+"&limit=8");const T0=norm(tit).trim(),A0=norm(art).trim();
    for(const it of d.data||[]){const tt=norm(it.title_short||it.title).trim(),aa=norm(it.artist&&it.artist.name).trim();let s=0;
      let ts=0;if(tt===T0)ts=3;else if(tt&&((" "+tt+" ").includes(" "+T0+" ")||(" "+T0+" ").includes(" "+tt+" ")))ts=2;if(ts<2)continue;s+=ts;   // le titre doit au moins être inclus : un mot en commun ne suffit plus
      if(A0){if(aa===A0)s+=3;else if(aa&&(aa.includes(A0.split(" ")[0])||A0.includes(aa)))s+=2;}else s+=1;
      if(s>bs){bs=s;best=it;}}
    if(best&&bs>=(swapped?6:4))return dzItemA(best);}catch(e){throw e;}   // une erreur de réseau n'est plus un « introuvable » : plMatch la distingue
  return !swapped&&x.a?dzMatch({t:x.a,a:x.t},true):null;}

let plBusy=null;let plNet=new WeakSet();   /* sons dont la recherche a échoué par le réseau : pas marqués « introuvables », réessayés au prochain lancement */
async function plMatch(p){const todo=p.items.filter(x=>!x.dz&&!x.miss&&!plNet.has(x));if(!todo.length)return;if(plBusy&&plBusy.id===p.id)return;const st={id:p.id,done:0,total:todo.length};plBusy=st;softListen();let k=0;

async function plSimilar(id){const p=plGet(id);if(!p||plSimBusy.has(id))return;plSimBusy.add(id);softListen();

    const arts=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]),have=new Set(p.items.map(x=>x.dz).filter(Boolean)),seen=new Set(),res=[];
    for(const a of arts){try{const x=p.items.find(y=>y.aid&&norm(y.dzA||y.a).includes(" "+a.split(" ")[0]+" "));let aid=x&&x.aid;
      if(!aid){const s=await jsonp("https://api.deezer.com/search/artist?q="+encodeURIComponent(a)+"&limit=1");aid=s.data&&s.data[0]&&s.data[0].id;}
      if(!aid)continue;const r=await jsonp(`https://api.deezer.com/artist/${aid}/radio?limit=15`);
      for(const t of r.data||[]){const it=dzItemA(t);if(!t.preview||have.has(it.dz)||seen.has(it.dz)||libMatch(it))continue;seen.add(it.dz);it.peu=it.pop<PEU_CONNU;res.push(it);}}
      catch(e){/* un artiste sans radio Deezer ne bloque pas les autres */}
      await sleep(150);}
    if(!res.length)throw new Error("rien de nouveau trouvé");p.sim=shuffle(res).sort((a,b)=>(b.peu?1:0)-(a.peu?1:0)).slice(0,30);analyzeQueue(p.sim);}
  catch(e){toast("Suggestions impossibles : "+esc(e.message),false,true);}
  plSimBusy.delete(id);save();softListen();}
async function startRadio(){if(!PL)return;const x=PL.x;toast(`Je prépare une radio autour de « ${esc(x.t)} »…`);
  try{let aid=null;const dz=x.dz||(PL.u.startsWith("dz")?+PL.u.slice(2):null);
    if(dz){const d=await jsonp(`https://api.deezer.com/track/${dz}`);aid=d.artist&&d.artist.id;}
    if(!aid&&x.a){const s=await jsonp("https://api.deezer.com/search/artist?q="+encodeURIComponent(String(x.a).split(/,|&| feat/i)[0])+"&limit=1");aid=s.data&&s.data[0]&&s.data[0].id;}
    if(!aid)throw new Error("artiste introuvable");const r=await jsonp(`https://api.deezer.com/artist/${aid}/radio?limit=40`);
    const items=(r.data||[]).filter(t=>t.preview).map(dzItemA);if(!items.length)throw new Error("radio vide");
    S.radio=items;qStart(items.map(it=>({dz:it.dz,t:it.t,a:it.a,cover:it.cover})),0,"Radio · "+(x.a||x.t));}catch(e){toast("Radio impossible : "+esc(e.message),false,true);}}

/* ---------- Enchaînement sans coupure : le son suivant est prêt AVANT la fin du son en cours ---------- */
const DZP={};let QPRE=null;
async function dzPreview(dz){const c=DZP[dz];if(c&&Date.now()-c.t<8*60e3)return c.u;const d=await jsonp(`https://api.deezer.com/track/${dz}`);
  if(!d.preview)throw new Error("pas d’extrait");DZP[dz]={u:d.preview,t:Date.now()};return d.preview;}
/** Indice du son suivant, sans rien lancer. En aléatoire, le choix est gardé pour que le son préparé soit bien celui qui jouera. */
function qPeek(auto){const n=Q.items.length;if(!n)return -1;if(auto&&Q.repeat==="one")return Q.i;
  if(Q.shuffle&&n>1){if(Q.nextI!=null&&Q.nextI!==Q.i&&Q.nextI<n&&!Q.played.has(Q.nextI))return Q.nextI;
    let left=Q.items.map((_,j)=>j).filter(j=>!Q.played.has(j));
    if(!left.length){if(auto&&Q.repeat!=="all")return -1;Q.played=new Set([Q.i]);left=Q.items.map((_,j)=>j).filter(j=>j!==Q.i);}
    return (Q.nextI=left[Math.floor(Math.random()*left.length)]);}
  let i=Q.i+1;if(i>=n){if(auto&&Q.repeat!=="all")return -1;i=0;}return i;}
function qNext(auto=false){const i=qPeek(auto);if(i<0)return stopPlay();qPlay(i);}
async function qPrefetch(){const i=qPeek(true);if(i<0||i===Q.i)return;const it=Q.items[i],key=qKey(it);if(QPRE&&QPRE.i===i&&QPRE.k===key)return;
  try{let url,x,src;const tr=it.n&&T(it.n);
    if(it.fid){const b=await DB.get("file_"+it.fid);if(!b)return;url=URL.createObjectURL(b);x={t:it.t,a:it.a};src="sur cet appareil";}
    else if(it.dz||(tr&&tr.wish&&tr.dz)){const dz=it.dz||tr.dz;url=await dzPreview(dz);x=tr?tr:{dz,t:it.t,a:it.a,cover:it.cover};src="extrait 30 s · Deezer";}
    else return;
    if(QPRE&&QPRE.url&&QPRE.url.startsWith("blob:"))URL.revokeObjectURL(QPRE.url);
    QPRE={i,k:key,url,x,src};ev("prêt",x.t);}catch(e){ev("prépa-ko",e.message);}}
AU.addEventListener("playing",()=>{if(inQueue())qPrefetch();});
/** Fin d’un son de la file : on remplace la source et on relance tout de suite, sans repasser par l’arrêt ni par Internet. */
function qAdvance(){const i=qPeek(true);if(i<0)return stopPlay();const it=Q.items[i],pre=QPRE;
  if(i===Q.i){AU.currentTime=0;AU.play().catch(()=>qPlay(i));return;}
  if(pre&&pre.i===i&&pre.k===qKey(it)&&pre.url){const old=AU.src;Q.i=i;Q.nextI=null;Q.played.add(i);Q.fails=0;PL={u:qKey(it),x:pre.x,src:pre.src};QPRE=null;
    if(old&&old.startsWith("blob:")&&old!==pre.url)URL.revokeObjectURL(old);AU.src=pre.url;const pr=AU.play();mediaSync();
    pr.then(()=>{ev("enchaîné",pre.x.t);startProg();renderPlayer();refreshPlay();},e=>{ev("enchaîné-ko",e.message);qPlay(i);});return;}
  ev("pas prêt → chargement normal");qPlay(i);}
AU.onended=()=>{ev("fin du son");if(inQueue())qAdvance();else stopPlay();};

/* ---------- Partager (menu Partager de l’iPhone : AirDrop, WhatsApp, Notes, Fichiers…) ---------- */
async function shareOut({title,text,file,name,type}){
  try{if(file&&navigator.canShare){const f=new File([file],name,{type:type||file.type||"text/plain"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return "partage";}}
    if(!file&&navigator.share){await navigator.share({title,text});return "partage";}}

  /* on ne copie que des champs du bon genre (comme au démarrage) et jamais l'écran, la démo ou la soirée en cours de cet appareil */
  const SKIP=["screen","sel","search","demo","realSnap","undo","soir","tracks","set","cur","own"];
  for(const k of Object.keys(st)){if(SKIP.includes(k)||k==="__proto__")continue;if(sameKind(DEFAULTS[k],st[k]))S[k]=st[k];}
  if(Array.isArray(st.tracks))S.tracks=st.tracks.filter(t=>isObj(t)&&typeof t.n==="number"&&typeof t.path==="string");
  if(isObj(st.set)&&Array.isArray(st.set.ids))S.set=st.set;
  if(Array.isArray(st.own))S.own=st.own.filter(o=>isObj(o)&&o.fid!=null);
  if(S.demo){S.demo=false;delete S.realSnap;}   // la sauvegarde remplace tout : plus de copie « vraie bibliothèque » à rendre à la sortie de la démo
  sanitizeState(DEFAULTS);reindex();
  S.nextN=Math.max(S.nextN,...S.tracks.map(t=>t.n+1),1);
  S.set.ids=S.set.ids.filter(n=>T(n));S.cur=T(st.cur)?st.cur:(T(S.cur)?S.cur:(S.set.ids.length?S.set.ids[S.set.ids.length-1]:null));
  S.undo=[];try{updUndo();}catch(e){}
  if(S.soir.on&&!soirGig()){S.soir={on:false,gig:null,t0:0,log:[]};clearInterval(soirClock);soirUnwake();soirDraw();}
  const all=[...cur,...(S.own||[])],seen=new Set(),ok=[];
  for(const o of all){if(seen.has(o.fid))continue;seen.add(o.fid);if(await DB.get("file_"+o.fid))ok.push(o);}
  const lost=all.filter((o,i)=>all.findIndex(x=>x.fid===o.fid)===i).length-ok.length;S.own=ok;S.pls=(Array.isArray(S.pls)?S.pls:[]).filter(isObj);reindex();save(true);render();
  toast(lost>0?`Données restaurées. ${pl(lost,"fichier")} audio de la sauvegarde ne sont pas sur cet appareil : à rajouter.`:"Données restaurées.");return true;}

/* ===================== 1.7 Liens avec Apple Music et Spotify, sans compte développeur =====================
   - Retrouver un son dans Apple Music (API gratuite iTunes Search) : ouvrir dans Musique, lecteur Apple intégré.
   - Envoyer une playlist vers Apple Music par un raccourci iPhone (presse-papiers + shortcuts://).
   - Importer son historique et ses playlists depuis les fichiers d'export officiels d'Apple et de Spotify.
   Rien n'est envoyé à un serveur : les fichiers sont lus sur l'appareil. */
Object.assign(IC,{apple:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>'});

/* ---------- Retrouver un son dans Apple Music ---------- */
const amKey=x=>norm((x.a||"")+" "+(x.t||"")).trim();
let amLast=0,amChain=Promise.resolve();
function amScore(x,it){const T0=norm(baseTitle(x.t)).trim(),tt=norm(baseTitle(it.trackName)).trim(),A0=norm(String(x.a||"").split(/,|&| feat/i)[0]).trim(),aa=norm(it.artistName).trim();let s=0;
  if(tt===T0)s+=3;else if(tt&&(tt.includes(T0)||T0.includes(tt)))s+=2;
  if(A0){if(aa===A0||aa.includes(A0))s+=3;else if(aa&&(aa.includes(A0.split(" ")[0])||A0.includes(aa)))s+=2;}else s+=1;return s;}
/** Une recherche toutes les 3,2 s : Apple limite à environ 20 par minute. Le résultat (même « introuvable ») est gardé. */
/* 1.12.5 : un lien Apple ne sert que s’il pointe vraiment vers Apple (le cache peut venir d’une sauvegarde importée) */
const amOk=m=>{if(m===undefined)return undefined;if(!m||typeof m!=="object")return null;const u=String(m.url||"");if(!/^https:\/\/(music|itunes|geo\.music)\.apple\.com\/[^\s"'<>\\]*$/.test(u))return null;return {...m,id:+m.id||0,coll:+m.coll||0,url:u,t:String(m.t||""),a:String(m.a||"")};};
function amMatch(x){const k=amKey(x);if(!k)return Promise.resolve(null);if(S.am[k]!==undefined)return Promise.resolve(amOk(S.am[k]));
  const run=amChain.then(async()=>{if(S.am[k]!==undefined)return amOk(S.am[k]);const wait=3200-(Date.now()-amLast);if(wait>0)await sleep(wait);amLast=Date.now();
    const q=encodeURIComponent((String(x.a||"").split(/,|&| feat/i)[0]+" "+String(x.t||"").replace(/\(.*?\)|\[.*?\]/g,"")).trim());
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);   /* 1.10.6 : sans délai, une réponse qui ne vient pas bloquait toute la chaîne derrière */
    let r;try{r=await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=6&country=${AMC}`,{signal:ac.signal});}catch(e){throw new Error(navigator.onLine===false?"Pas de réseau.":"Apple ne répond pas, réessaie dans un moment.");}finally{clearTimeout(tm);}
    if(r.status===429||r.status===403)amLast=Date.now()+27000;   // trop de requêtes : la suivante part dans 30 s au lieu de 3,2 s
    if(!r.ok)throw new Error("Apple a répondu "+r.status+" (trop de recherches ? attends une minute)");
    const d=await r.json();let best=null,bs=0;for(const it of d.results||[]){const s=amScore(x,it);if(s>bs){bs=s;best=it;}}
    const m=best&&bs>=(x.a?4:3)?{id:best.trackId,coll:best.collectionId,url:best.trackViewUrl,t:best.trackName,a:best.artistName}:null;
    const m2=amOk(m);S.am[k]=m2;if(Object.keys(S.am).length>600){for(const kk of Object.keys(S.am).slice(0,100))delete S.am[kk];}save();return m2;});
  amChain=run.catch(()=>{});return run;}

function importHistoryFile(){const i=$("#fileIn");i.accept=".csv,.json,.txt,.tsv";i.multiple=true;
  i.onchange=async()=>{const fs=[...i.files];i.value="";i.multiple=false;if(!fs.length)return;
    const plays=new Map(),pls=[];let nFiles=0,skipped=[];
    for(const f of fs){if(f.size>80*1048576){skipped.push(f.name+" (trop lourd)");continue;}
      try{const b=new Uint8Array(await f.arrayBuffer()),enc=b[0]===0xFF&&b[1]===0xFE?"utf-16le":"utf-8",r=parseHistory(new TextDecoder(enc).decode(b),f.name);
        if(!r.plays.length&&!r.playlists.length){skipped.push(f.name);continue;}nFiles++;
        for(const p of r.plays){const k=norm(p.a+" "+p.t).trim(),c=plays.get(k)||{t:p.t,a:p.a,n:0};c.n++;plays.set(k,c);}
        pls.push(...r.playlists);}
      catch(e){skipped.push(f.name+" ("+e.message+")");logErr("historique",e.message,f.name);}}
    if(!nFiles)return toast("Aucun son reconnu dans ces fichiers : "+(esc(skipped.join(", "))||"vide")+". Regarde l’aide « Mon historique ».",false,true);
    const top=[...plays.values()].sort((x,y)=>y.n-x.n).slice(0,100);let made=0;
    for(const p of pls){const its=[],seen=new Set();for(const x of p.items){const k=norm(x.a+" "+x.t);if(x.t&&!seen.has(k)){seen.add(k);its.push({t:x.t,a:x.a});}}
      if(its.length){S.pls.push({id:"p"+Date.now().toString(36)+made,name:p.name||"Playlist importée",src:"fichier",date:Date.now(),items:its,cover:null});made++;}}
    let hp=null;if(top.length){hp={id:"h"+Date.now().toString(36),name:"Mes sons les plus écoutés",src:"historique",date:Date.now(),items:top.map(x=>({t:x.t,a:x.a,plays:x.n})),cover:null};S.pls.unshift(hp);}
    save();S.lsTab="pls";S.plOpen=hp?hp.id:null;go("listen");
    toast(`${top.length?pl([...plays.values()].reduce((a,b)=>a+b.n,0),"écoute")+" lues, "+pl(plays.size,"son")+" différents. ":""}${made?pl(made,"playlist")+" importée"+(made>1?"s":"")+".":""}${skipped.length?" Ignoré : "+esc(skipped.join(", "))+".":""}`);
    if(hp){plMatch(hp);for(let k=0;k<400&&plBusy;k++)await sleep(500);if(!plSimBusy.has(hp.id))plSimilar(hp.id);}};
  i.click();}
/** Lit un export Apple (CSV) ou Spotify (JSON). Retourne {plays:[{t,a}], playlists:[{name,items}]}. */
function parseHistory(text,name){const out={plays:[],playlists:[]},t=String(text||"").replace(/^﻿/,"").trim();if(!t)return out;
  if(t[0]==="["||t[0]==="{"){let o;try{o=JSON.parse(t);}catch(e){throw new Error("JSON illisible");}
    const arr=Array.isArray(o)?o:null;
    if(arr){for(const e of arr){if(!e||typeof e!=="object")continue;
      const tn=e.trackName||e.master_metadata_track_name,an=e.artistName||e.master_metadata_album_artist_name,ms=e.msPlayed!=null?e.msPlayed:e.ms_played;
      if(tn&&(ms==null||ms>=30000))out.plays.push({t:tn,a:an||""});}}
    const lists=o&&o.playlists;if(Array.isArray(lists))for(const p of lists){const items=[];for(const it of p.items||[]){const tr=it.track||it;const tn=tr.trackName||tr.track_name,an=tr.artistName||tr.artist_name;if(tn)items.push({t:tn,a:an||""});}
      if(items.length)out.playlists.push({name:p.name,items});}
    return out;}
  const first=t.slice(0,t.indexOf("\n")>0?t.indexOf("\n"):200),sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const lines=t.split(/\r\n|\r|\n/).filter(Boolean),head=splitRow(lines[0],sep).map(c=>c.toLowerCase().trim());
  const col=re=>head.findIndex(c=>re.test(c)),ti=col(/^(song name|track name|trackname|title|titre|name|nom)$/),ai=col(/^(artist name|artistname|artist|artiste|album artist)$/),di=col(/^(track description)$/),du=col(/(play duration|ms played|duration milliseconds|duration)/);
  if(ti<0&&di<0){/* texte libre : seules les lignes « Artiste - Titre » comptent, un mot seul n’est pas un son */for(const x of parseList(t))if(x.a)out.plays.push(x);return out;}
  for(let i=1;i<lines.length;i++){const r=splitRow(lines[i],sep);let tt="",aa="";
    if(ti>=0){tt=(r[ti]||"").trim();aa=ai>=0?(r[ai]||"").trim():"";}else{const m=parseName(r[di]||"");tt=m.t;aa=m.a;}
    if(!tt)continue;if(du>=0){const ms=parseInt(r[du],10);if(!isNaN(ms)&&ms<30000)continue;}
    out.plays.push({t:tt,a:aa});}
  return out;}

/* ---------- Un seul compteur de requêtes Deezer pour toute l'appli (quota mesuré : ≈45 par 5 s) ---------- */
const _jsonp=jsonp;let dzStamps=[],dzBlock=0,dzNoteT=0;
async function dzGate(low){for(;;){const now=Date.now();if(now<dzBlock){await sleep(dzBlock-now+50);continue;}
  dzStamps=dzStamps.filter(t=>now-t<5000);const cap=low?22:35;   // l’analyse en arrière-plan garde de la place pour ce que tu regardes
  if(dzStamps.length<cap){dzStamps.push(now);return;}await sleep(Math.max(150,5000-(now-dzStamps[0])+30));}}
jsonp=async function(url,ms=8000,prio){if(!/api\.deezer\.com/.test(url))return _jsonp(url,ms);
  for(let a=0;;a++){await dzGate(prio==="low");
    try{return await _jsonp(url,ms);}
    catch(e){if(/quota/i.test(e.message)&&a<5){dzBlock=Date.now()+2000*Math.min(8,2**a);if(Date.now()-dzNoteT>20000){dzNoteT=Date.now();toast("Deezer demande une courte pause : je reprends tout seul.");}ev&&ev("deezer-quota","essai "+(a+1));continue;}
      throw e;}}};

function discScroll(){if(S.screen!=="trend"||S.trTab!=="decouverte"||S.search.q||discBusy||!(S.disc.items||[]).length)return;
  if(Date.now()-scrT<1800||!discNearBottom())return;scrT=Date.now();
  if(S.disc.items.length>600){S.disc.items=S.disc.items.slice(-450);}   // la liste reste légère au-delà de 600 : les sons vus ne reviennent pas
  moreDisc();}

   Causes mesurées dans la 1.8 (30/10/2026, ordinateur rapide) :
   - 5 redessins complets de la page en 10 s sans toucher l'écran (l'analyse des sons rafraîchit tout l'écran) ;
   - 27 tâches longues, 3,7 s d'interface bloquée en 18 s : une seule analyse (décodage + FFT) bloque 560 ms.
   Corrections : (1) l'analyse tourne dans un second fil (worker), (2) les rafraîchissements automatiques attendent que le doigt
   soit levé et l'écran immobile, et sont espacés, (3) l'analyse attend aussi le calme. */

/* ---------- Savoir si le doigt est posé ou si l'écran défile ---------- */
let touching=false,gsTouchAt=0,lastScr=0,lrT=null,lrLast=0;
const calm=()=>!touching&&Date.now()-gsTouchAt>600&&Date.now()-lastScr>600;
document.addEventListener("touchstart",()=>{touching=true;gsTouchAt=Date.now();},{passive:true,capture:true});
["touchend","touchcancel"].forEach(n=>document.addEventListener(n,()=>{touching=false;gsTouchAt=Date.now();},{passive:true,capture:true}));
