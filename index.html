{const m=$("#main");if(m)m.addEventListener("scroll",()=>{lastScr=Date.now();},{passive:true});}

/* ---------- Rafraîchissements automatiques : jamais pendant un geste, au plus un toutes les 3 s ---------- */
const _liveRefresh=liveRefresh;
liveRefresh=function(){const wait=!calm()?650:Math.max(0,3000-(Date.now()-lrLast));
  if(wait>0){if(!lrT)lrT=setTimeout(()=>{lrT=null;liveRefresh();},wait);return;}
  lrLast=Date.now();_liveRefresh();};

/* ---------- L'analyse audio quitte le fil principal ---------- */
const SMW=(()=>{try{const src=[smFFT.toString(),smAnalyze.toString(),"const MAJOR="+JSON.stringify(MAJOR)+",MINOR="+JSON.stringify(MINOR)+";",
  "onmessage=e=>{const {id,data,sr,sec}=e.data;try{const f=new Float32Array(data);postMessage({id,r:smAnalyze({sampleRate:sr,length:f.length,numberOfChannels:1,getChannelData:()=>f},sec)});}catch(err){postMessage({id,err:String(err&&err.message||err)});}};"].join("\n");
  const w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));w.onerror=()=>{logErr&&logErr("worker","analyse audio indisponible");smwOK=false;};return w;}catch(e){return null;}})();
let smwOK=!!SMW,smId=0;const smPend=new Map();
if(SMW)SMW.onmessage=e=>{const p=smPend.get(e.data.id);if(!p)return;smPend.delete(e.data.id);e.data.err?p.rej(new Error(e.data.err)):p.res(e.data.r);};
/** Même calcul qu'avant (smAnalyze), mais dans le worker : l'interface ne se fige plus. */
function analyzeOff(ab,sec){if(!smwOK||!SMW)return Promise.resolve(smAnalyze(ab,sec));
  const n=ab.length,ch=ab.numberOfChannels,mono=new Float32Array(n);
  for(let c=0;c<ch;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ch;}
  return new Promise((res,rej)=>{const id=++smId;smPend.set(id,{res,rej});setTimeout(()=>{if(smPend.has(id)){smPend.delete(id);rej(new Error("analyse trop longue"));}},60000);SMW.postMessage({id,data:mono.buffer,sr:ab.sampleRate,sec},[mono.buffer]);});}

  const reqs=L.filter(l=>l.k==="req").slice(-3).reverse().map(l=>T(l.n)).filter(Boolean);
  const wl=WLst==="ok"?`<div class="sw ok" id="soirWL">● Écran gardé allumé</div>`:WLst===""?`<div class="sw" id="soirWL">Écran : vérification…</div>`:
    `<div class="sw warn" id="soirWL">L’écran peut s’éteindre tout seul (${WLst==="absent"?"ton appareil ne le permet pas":WLst==="perdu"?"le verrou a été perdu":"le téléphone a refusé"}). Réglages › Luminosité › Verrouillage auto › Jamais, pendant la soirée.</div>`;
  const started=L.some(l=>l.k==="play");   // le son resté « en cours » de la préparation n'est pas un son joué
  const first=`<div class="sreq"><b>${started?"Jouer un autre son":"Quel est le premier son ?"}</b><div class="row2"><input id="soirQ" type="search" placeholder="Tape le début du titre ou de l’artiste" value="${esc(soirDraft.q)}" oninput="soirQin(event)" oncompositionend="soirDraft.q=this.value;soirFind()" onkeydown="if(event.key==='Enter'){soirFind()}" aria-label="${started?"Chercher le son joué":"Chercher le premier son"}"><button class="sm2" onclick="soirFind()">Chercher</button></div>
      <div class="sres" id="soirRes">${soirResHtml()}</div></div>`;
  let mid=first,cur="";
  if(c){const p=soirPick();
    cur=`<div class="scur">${cover(c)}<div class="t"><span class="hint">${started?"En cours":"Prévu au départ"}</span><b>${esc(c.t)}</b><span class="hint">${esc(c.a)}${c.bpm?" · "+Math.round(c.bpm)+" BPM":""}${c.k?" · "+esc(c.k):""}</span></div></div>
      ${started?"":`<button class="sm2 ghost" id="soirStartCur" onclick="soirTap(soirPlay,${c.n})">Commencer par celui-ci</button>`}
      <button class="sbtn sbig" id="soirNextB" onclick="soirTap(soirNext)" aria-label="Son suivant">${p?`SON SUIVANT<small>${esc(p.c.t)} · ${esc(p.c.a)}</small>`:`PAS DE PROPOSITION<small>Cherche le son ci-dessous</small>`}</button>
      ${p?`<button class="sm2 ghost" onclick="soirOther()">Autre proposition</button>`:""}
      <div class="s2"><button class="sbtn sok ${up?"on":""}" id="soirOk" onclick="soirMark(true)" aria-pressed="${up}" ${started?"":"disabled"}>▲ A marché</button><button class="sbtn sko ${dn?"on":""}" id="soirKo" onclick="soirMark(false)" aria-pressed="${dn}" ${started?"":"disabled"}>▼ Flop</button></div>`;
    mid=started?cur+first:first+cur;}
  el.innerHTML=`<div class="sh"><span><b>Mode soirée</b> · <span id="soirT">0:00:00</span></span><span id="soirN">${pl(np,"son")} joué${np>1?"s":""}</span></div>${wl}${mid}
    <div class="sreq"><b>Demande du public</b><div class="row2"><input id="soirR" type="text" enterkeyhint="done" placeholder="Artiste - Titre" value="${esc(soirDraft.req)}" oninput="soirDraft.req=this.value" onkeydown="if(event.key==='Enter'){soirReq()}" aria-label="Son demandé par le public"><button class="sm2" id="soirReqB" onclick="soirReq()">Noter</button></div>
      ${reqs.map(t=>`<span class="hint">✓ ${esc(t.a?t.a+" - ":"")}${esc(t.t)}</span>`).join("")}<span class="hint">Pour dicter : touche le micro du clavier de ton iPhone.</span></div>
    <div class="sfoot">${soirAsk?`<span>Terminer la soirée ?</span><span style="display:flex;gap:8px"><button class="sm2 ghost" onclick="soirAsk=false;soirDraw();soirWake()">Non</button><button class="sm2 red" id="soirEndB" onclick="soirEnd()">Oui, terminer</button></span>`:`<span class="hint">Tout est enregistré tout seul.</span><button class="sm2 ghost" id="soirAskB" onclick="soirAsk=true;soirDraw()">Terminer</button>`}</div>`;
  soirTick();}

/* ===================== 1.12 REFONTE INTUITIVE : écrans réécrits (reprennent la logique existante, changent seulement ce qu'on voit) ===================== */
VIEWS.home=()=>{
  if(!S.tracks.length)return welcome();
  const up=upGigs()[0],pd=pendingDeb(),vq=valQueue().length,h=new Date().getHours(),wl=wishes().length,a=qList().length+tList().length;
  let carte;
  if(up){const c=gigCheck(up),done=c.filter(x=>x[0]).length,dd=daysUntil(up.date),mine=S.set.gig===up.id,pret=mine&&S.set.ids.length>1,usb=!!(up.check&&up.check.usb);
    const bouton=!pret?"Préparer mon set":!usb?"Copier sur ma clé USB":"Voir mon set";
    carte=`<div class="card2"><span class="tag info">${dd===0?"CE SOIR":dd===1?"DEMAIN":"DANS "+dd+" JOURS"}</span><h2 class="c2t">${esc(up.theme&&up.theme!=="Prochaine soirée"?up.theme:up.lieu||up.type)}</h2><div class="hint">${fmtDate(up.date)} · ${esc(up.lieu)}</div>
      <div class="prog" aria-label="Préparation ${done} sur ${c.length}"><i style="width:${Math.round(done/c.length*100)}%"></i></div><div class="hint" style="margin-bottom:14px">Préparation ${done} sur ${c.length}</div>
      <button class="cta" onclick="linkSet(${up.id})">${bouton}</button></div>`;}
  else carte=`<div class="card2"><h2 class="c2t">Ajoute ta première soirée</h2><p class="hint" style="margin:0 0 14px">Donne une date et un lieu : je te guide pour préparer ton set.</p><button class="cta" onclick="go('gigs');newGig()">Nouvelle soirée</button></div>`;
  const tuile=(ic,t,s,on)=>`<button class="tile2" onclick="${on}"><span class="ti2">${svg(ic,24)}</span><b>${t}</b><span>${s}</span></button>`;
  const ligne=(t,on,cl)=>`<button class="lrow ${cl||""}" onclick="${on}"><span>${t}</span><span>›</span></button>`;
  return `<div class="hero"><div><h1>${h>=18||h<5?"Bonsoir":"Salut"}${S.name?", "+esc(S.name):""}</h1><p class="sub" style="margin:4px 0 0">Voilà ce qui t’attend.</p></div></div>
  ${carte}
  <div class="tiles2">${tuile("trend","Trouver du son","Les sons du moment","go('trend')")}${pd.length?tuile("debrief","Raconter ma soirée",`Soirée du ${fmtDate(pd[0].date)}`,`S.dGig=${pd[0].id};go('debrief')`):tuile("lib","Ma musique",pl(visible().length,"son"),"go('lib')")}</div>
  ${vq?ligne(`${pl(vq,"son")} à contrôler`,"S.libView='check';go('lib')","or"):""}
  ${a||wl?ligne(`${pl(a||wl,"son")} à récupérer`,"S.trTab='liste';go('trend')"):""}
  ${S.demo?`<div class="card2" style="margin-top:14px"><b>Tu fais un essai.</b><p class="hint" style="margin:4px 0 12px">Ces sons sont des exemples. Rien n’est écrit dans Serato.</p><button class="cta sec" onclick="leaveDemo()">${MOBILE&&!FSA?"Quitter l’essai":"Ajouter ma musique"}</button></div>`:""}`;};

VIEWS.gigs=()=>{const up=upGigs(),past=pastGigs();
  const statut=g=>{const pret=S.set.gig===g.id&&S.set.ids.length>1;return !pret?"Set à préparer":(g.check&&g.check.usb)?"Set prêt, copié sur la clé":"Clé USB à faire";};
  const nom=g=>esc(g.theme&&g.theme!=="Prochaine soirée"?g.theme:(g.lieu||g.type));
  return `<h1 class="scrT">Mes soirées</h1><button class="cta" onclick="newGig()">${svg("plus",18)}Nouvelle soirée</button>
  <h3 class="sect">À venir</h3>${up.length?up.map(g=>{const dd=daysUntil(g.date);
    return `<div class="gcard" role="button" tabindex="0" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();this.click()}" onclick="linkSet(${+g.id||0})"><div class="row between" style="flex-wrap:nowrap"><span class="tag info">${dd===0?"CE SOIR":dd===1?"DEMAIN":"DANS "+dd+" JOURS"}</span><button class="lnk2 sm" onclick="event.stopPropagation();editGig(${+g.id||0})">Modifier</button></div>
      <b class="gct">${nom(g)}</b><div class="hint">${fmtDate(g.date)} · ${esc(g.lieu)}${g.time?" · "+esc(g.time):""}</div><div class="gst">${statut(g)} ›</div></div>`;}).join(""):`<div class="empty">Aucune soirée prévue. Ajoutes-en une.</div>`}
  <h3 class="sect">Passées</h3>${past.length?past.map(g=>`<div class="gcard slim" role="button" tabindex="0" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();this.click()}" onclick="gigDetail(${+g.id||0})"><div style="min-width:0"><b>${fmtDate(g.date)}</b><div class="hint">${esc(g.lieu)} · ${pl(g.played.length,"son")}</div></div>
      ${g.deb?`<span class="tag ok">Bilan fait</span>`:g.type==="Live / contenu"?"":`<button class="pillo" onclick="event.stopPropagation();S.dGig=${+g.id||0};go('debrief')">Raconter ma soirée</button>`}</div>`).join(""):`<div class="empty">Aucune soirée passée.</div>`}
  <button class="lnk2" onclick="importHistory()">Importer mon historique Serato</button>`;};

/* ===================== 1.12.4 · COPIES DE SECOURS, SONS MASQUÉS, NOUVELLE VERSION =====================
   Rien ici n'efface un fichier audio ni une donnée : on ajoute des copies et on rend visible ce qui était caché. */
function ymd(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const fmtD=t=>new Date(t).toLocaleDateString("fr-FR");
const verNum=v=>String(v).split(".").reduce((a,x,i)=>a+(parseInt(x)||0)/Math.pow(1000,i),0);
/* La liste des copies (dates, nombres) est gardée à part, pour l'afficher sans relire les copies elles-mêmes */
function bkMeta(p){BK=Object.assign({},BK,p);for(const k of Object.keys(BK))if(BK[k]==null)delete BK[k];return DB.set("bk_meta",BK);}
/* Met à plat un état : en mode démo, ce sont les vrais sons (gardés dans realSnap) qui sont sauvegardés, jamais les sons d'exemple */
function flatState(st,tr){const o={...st};
  if(o.demo&&isObj(o.realSnap)){REAL_KEYS.forEach(k=>{if(k in o.realSnap)o[k]=o.realSnap[k];});o.demo=false;delete o.realSnap;}
  else o.tracks=tr;
  if(!Array.isArray(o.tracks))o.tracks=[];return o;}
function buildBackup(){return {setmate:VERSION,date:Date.now(),state:flatState({...S,undo:undefined},S.tracks)};}
function markBackup(){S.flags=isObj(S.flags)?S.flags:{};S.flags.lastBackup=Date.now();save();try{if(S.screen==="settings")render();}catch(e){}}
function audioNote(){const n=(S.own||[]).length;return n?` Les ${pl(n,"fichier")} audio ajouté${n>1?"s":""} sur cet appareil ne sont pas dans la sauvegarde : garde les originaux.`:"";}
/* Copie de l'état actuel juste avant une restauration (pour pouvoir l'annuler) */
async function saveSafetyCopy(){if(DB.readFail)return;
  try{const state=JSON.parse(JSON.stringify(buildBackup().state));const prev={date:Date.now(),version:VERSION,state};
    if(await DB.set("state_prev",prev))await bkMeta({statePrev:{date:prev.date,tracks:state.tracks.length,gigs:(state.gigs||[]).length}});
    else toast("Je n’ai pas pu garder de copie de secours de l’état actuel (place pleine ?).",false,true);}catch(e){}}
/* Copie de la bibliothèque d'avant une lecture Serato qui a fait disparaître des sons (on en garde deux) */
async function savePrevTracks(){
  try{const old=await DB.get("tracks_prev"),p=BK.tracksPrev;
    if(Array.isArray(old)&&old.length){if(await DB.set("tracks_prev2",old))BK=Object.assign({},BK,{tracksPrev2:p||{date:0,n:old.length}});}
    if(await DB.set("tracks_prev",S.tracks))await bkMeta({tracksPrev:{date:Date.now(),n:S.tracks.length}});}catch(e){}}
/* Sauvegarde automatique glissante : au premier enregistrement de la journée, on copie l'état tel qu'il était au début du jour. On garde 3 jours. */
let AUTO_DAY="";
async function autoBackup(){const day=ymd();if(AUTO_DAY===day||DB.readFail||!DB.db||RO||Date.now()<AUTO_WAIT)return;AUTO_DAY=day;
  try{if((BK.auto||[]).some(a=>a.day===day))return;
    const st=await DB.get("state");if(!isObj(st))return;const flat=flatState(st,await DB.get("tracks"));
    if(!(flat.tracks.length||(flat.gigs||[]).length||(flat.pls||[]).length||(flat.own||[]).length))return;   // on ne remplace jamais une bonne copie par une copie vide
    const rec={date:Date.now(),version:VERSION,state:flat};
    if(!(await DB.set("backup_auto_"+day,rec))){AUTO_DAY="";AUTO_WAIT=Date.now()+10*60*1000;return;}   /* échec (place pleine ?) : on retentera dans 10 minutes, pas seulement demain */
    const list=[...(BK.auto||[]),{day,date:rec.date,tracks:flat.tracks.length,gigs:(flat.gigs||[]).length}];
    while(list.length>3){const o=list.shift();await DB.del("backup_auto_"+o.day);}
    await bkMeta({auto:list});}catch(e){AUTO_DAY="";AUTO_WAIT=Date.now()+10*60*1000;}}
async function restoreCopy(key){const c=await DB.get(key);
  if(!c||!isObj(c.state)){toast("Cette copie n’est plus disponible.",false,true);return false;}
  return restoreState({setmate:c.version||VERSION,date:c.date,state:c.state});}
/* Sons disparus de Serato : on les remet à côté des sons actuels, sans rien remplacer */
async function recoverList(key){const p=await DB.get(key);if(!Array.isArray(p))return [];
  return p.filter(t=>isObj(t)&&typeof t.n==="number"&&typeof t.path==="string"&&!byPath.has(t.path)&&!byN.has(t.n));}
async function askRecover(key){const add=await recoverList(key);
  if(!add.length){toast("Rien à récupérer : tous les sons de cette copie sont déjà dans ta bibliothèque.");return;}
  modal(`<h2>Récupérer ${pl(add.length,"son")} ?</h2><p class="hint mt2">Ces sons étaient dans ta bibliothèque avant une lecture de Serato. Je les remets avec leur genre corrigé et leurs réglages. Je ne touche pas aux sons actuels. Ils sont notés « hors Serato » et restent dans SetMate.</p><div class="row mt" style="justify-content:flex-end;gap:8px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="closeModal();doRecover('${key}')">Récupérer</button></div>`);}
async function doRecover(key){const add=await recoverList(key);if(!add.length)return;
  add.forEach(t=>{const c=JSON.parse(JSON.stringify(t));c.inSerato=false;c.dupOf=null;S.tracks.push(c);});
  S.nextN=Math.max(S.nextN,...S.tracks.map(t=>t.n+1),1);reindex();findDups();save(true);render();
  toast(`${pl(add.length,"son")} récupéré${add.length>1?"s":""}.`);}
/* Sons masqués : voir et réafficher */
function unhideTrack(n){const x=T(n);if(!x)return;x.hidden=false;x.hiddenFor=null;findDups();save(true);render();toast("Son réaffiché : « "+esc(x.t)+" ».");}
function unhideAll(){let c=0;S.tracks.forEach(t=>{if(t.hidden){t.hidden=false;t.hiddenFor=null;c++;}});if(!c)return;findDups();save(true);render();toast(pl(c,"son")+" réaffiché"+(c>1?"s":"")+".");}
function hiddenCard(){const h=S.tracks.filter(t=>t.hidden);
  return `<div class="card mt"><h3>${svg("lib",16)} Sons masqués (${h.length})</h3><p class="hint mt2">Les sons que tu as masqués ne sont ni effacés ni touchés sur ton disque. Ils sont seulement cachés dans SetMate.</p>
  ${h.length?h.slice(0,100).map(t=>`<div class="mini"><div style="flex:1;min-width:0"><b>${esc(t.t)}</b><div class="hint">${esc(t.a||"")}</div></div><button class="btn sm ghost" onclick="unhideTrack(${t.n})">Réafficher</button></div>`).join("")+(h.length>100?`<p class="hint mt2">Et ${h.length-100} autres. Utilise « Tout réafficher ».</p>`:"")+`<div class="row mt"><button class="btn ghost sm" onclick="unhideAll()">Tout réafficher</button></div>`:`<p class="hint mt2">Aucun son masqué.</p>`}</div>`;}
/* Réglages : copies de secours et rappel de sauvegarde */
function backupCard(){const lb=S.flags&&S.flags.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null;
  const etat=!lb?'<span class="tag warn">Jamais faite</span>':days>14?`<span class="tag warn">Il y a ${days} jours</span>`:`<span class="tag ok">${days<1?"Aujourd’hui":"Il y a "+pl(days,"jour")}</span>`;
  const auto=(BK.auto||[]).slice().reverse(),sp=BK.statePrev,tp=BK.tracksPrev,tp2=BK.tracksPrev2;
  const row=(t,d,btn)=>`<div class="mini"><div style="flex:1;min-width:0"><b>${t}</b><div class="hint">${d}</div></div>${btn}</div>`;
  return `<div class="card mt"><h3>${svg("share",16)} Copies de secours</h3>
  ${row("Dernière sauvegarde en fichier "+etat,(lb?"Le "+fmtD(lb)+". ":"")+(!lb||days>14?"Fais-en une : c’est ta seule protection si le téléphone vide les données du site.":"Tout va bien."),`<button class="btn sm" onclick="exportData()">Sauvegarder</button>`)}
  ${auto.map(a=>row("Copie automatique du "+esc(fmtD(a.date)),pl(a.tracks||0,"son")+", "+pl(a.gigs||0,"soirée")+". État au début de cette journée.",`<button class="btn sm ghost" onclick="restoreCopy('backup_auto_${jsa(a.day)}')">Revenir là</button>`)).join("")}
  ${sp?row("Avant ta dernière restauration",`Du ${esc(fmtD(sp.date))} : ${pl(sp.tracks||0,"son")}, ${pl(sp.gigs||0,"soirée")}.`,`<button class="btn sm ghost" onclick="restoreCopy('state_prev')">Annuler la restauration</button>`):""}
  ${tp?row("Sons d’avant ta dernière lecture Serato",`Du ${esc(fmtD(tp.date))} : ${pl(tp.n||0,"son")}.`,`<button class="btn sm ghost" onclick="askRecover('tracks_prev')">Récupérer les sons disparus</button>`):""}
  ${tp2?row("Sons d’avant l’avant-dernière lecture",`${tp2.date?"Du "+esc(fmtD(tp2.date))+" : ":""}${pl(tp2.n||0,"son")}.`,`<button class="btn sm ghost" onclick="askRecover('tracks_prev2')">Récupérer les sons disparus</button>`):""}
  <p class="hint mt2">Ces copies restent sur cet appareil. « Tout effacer » les efface aussi.</p></div>`;}
const _vSet124=VIEWS.settings;
VIEWS.settings=()=>_vSet124()+backupCard()+hiddenCard();
/* Lecture des données impossible au démarrage : on n'écrit rien pour ne pas écraser ce qui existe */
function lectureImpossible(){modal(`<h2>Lecture impossible</h2><p class="hint mt2">Je n’arrive pas à relire tes données sur cet appareil. Elles ne sont pas effacées. Recharge la page. Tant que ce n’est pas réglé, je n’enregistre rien, pour ne pas les écraser.</p><div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="location.reload()">Recharger</button></div>`);}
/* Service worker : enregistré tout de suite, et un message quand une nouvelle version est prête */
function newVersionBanner(){if($("#newV"))return;const el=document.createElement("div");el.id="newV";el.className="toast";
  el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;max-width:92vw";
  el.innerHTML=`<span>Une mise à jour de la page est prête.${S.soir&&S.soir.on?" Recharge après ta soirée.":""}</span><button onclick="location.reload()">Recharger</button>`;document.body.appendChild(el);}
function registerSW(){if(!("serviceWorker" in navigator)||!/^https?:/.test(location.protocol))return;
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)newVersionBanner();});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.maj)newVersionBanner();});   /* le service worker a trouvé une version plus récente que celle affichée */
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{const maj=()=>reg.update().catch(()=>{});maj();setInterval(maj,30*60*1000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")maj();});}).catch(()=>{});}
/* 1.12.5 : retour au premier plan : on vérifie la connexion au stockage et on rattrape une écriture en attente */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"||RO)return;DB.probe();DB.ensure().then(ok=>{if(ok&&(tracksDirty||FAILN>0))save();});});
function msgStockage(){return DB.whyFail==="bloque"?"SetMate est ouvert dans un autre onglet qui bloque le stockage. Ferme les autres onglets SetMate, puis recharge la page."
  :(DB.whyFail==="erreur"||DB.whyFail==="absent")?"Je ne peux pas utiliser le stockage ici. En navigation privée, c’est normal : ouvre SetMate dans une fenêtre normale. Sinon tes données ne seront pas gardées après fermeture."
  :"Stockage indisponible ou trop lent : recharge la page. Si ça continue, tes données ne seront pas gardées après fermeture.";}
async function verifierPrive(){try{const e=await navigator.storage.estimate();if(e&&e.quota>0&&e.quota<130*1048576&&!installed())barre("privBar","Il semble que tu sois en navigation privée : à la fermeture de la fenêtre, tes données seront perdues. Ouvre SetMate dans une fenêtre normale.","");}catch(e){}}

/* ===================== DÉMARRAGE ===================== */
(async()=>{try{await prendreVerrou();}catch(e){}
  const sure=async(n,f)=>{try{await f()}catch(e){try{logErr("demarrage "+n,e&&e.message)}catch(_){}}};   /* une étape qui plante n'arrête pas les suivantes */
  try{await load();await loadLog();migrateStages();}catch(e){DB.ok=false;try{logErr("demarrage",e.message)}catch(_){}}
  navInit();render();STARTED=true;
  registerSW();if(DB.readFail)lectureImpossible();
  await sure("serato",async()=>{if(H.serato&&PERM.serato==="granted"&&!S.demo&&!DB.readFail)await loadSerato(false);});
  await sure("ecran",async()=>{render();startWatch();checkNews();});
  if(DB.ok)verifierPrive();
  await sure("soiree",async()=>{if(S.soir&&S.soir.on){if(Date.now()-S.soir.t0>16*36e5){soirAsk=true;soirDraw();clearInterval(soirClock);soirClock=setInterval(soirTick,1000);}else soirOpen();}});   // soirée en cours avant un rechargement : on la reprend
  await sure("tendances",async()=>{if(S.trends.date<lastThursday())await refreshTrends(true);else analyzeQueue(S.trends.items);});
  await sure("decouverte",async()=>{if(S.tracks.length&&(!S.disc.date||Date.now()-S.disc.date>7*864e5))loadDiscovery(true);else analyzeQueue(S.disc.items||[]);});
  if(!DB.ok&&!DB.readFail)toast(msgStockage(),false,true);
})();
</script>
